name: Assemble release draft
description: Verify and reconcile the exact same-run macOS, Windows, and Linux release assets.

inputs:
  linux-artifact-name:
    required: true
  macos-artifact-name:
    required: true
  windows-artifact-name:
    required: true

runs:
  using: composite
  steps:
    - name: Download same-run macOS artifacts
      uses: actions/download-artifact@v5
      with:
        name: ${{ inputs.macos-artifact-name }}
        path: release-assets/macos
    - name: Download same-run Windows artifacts
      uses: actions/download-artifact@v5
      with:
        name: ${{ inputs.windows-artifact-name }}
        path: release-assets/windows
    - name: Download same-run Linux artifacts
      uses: actions/download-artifact@v5
      with:
        name: ${{ inputs.linux-artifact-name }}
        path: release-assets/linux
    - name: Verify managed release assets
      shell: bash
      run: |
        set -euo pipefail
        test "$MACOS_SHA" = "$TARGET_SHA"
        test "$WINDOWS_SHA" = "$TARGET_SHA"
        test "$LINUX_SHA" = "$TARGET_SHA"
        test -f "release-assets/macos/Foliole-macOS-arm64-${TARGET_VERSION}.dmg"
        test -f "release-assets/macos/Foliole-macOS-arm64-${TARGET_VERSION}.dmg.blockmap"
        test -f "release-assets/macos/Foliole-macOS-arm64-${TARGET_VERSION}.zip"
        test -f "release-assets/macos/Foliole-macOS-arm64-${TARGET_VERSION}.zip.blockmap"
        test -f "release-assets/macos/latest-mac.yml"
        (cd release-assets/macos && sha256sum --check SHA256SUMS.txt)
        test -f "release-assets/windows/Foliole-Windows-x64-${TARGET_VERSION}.exe"
        test -f "release-assets/windows/Foliole-Windows-x64-${TARGET_VERSION}.exe.blockmap"
        test -f "release-assets/windows/latest.yml"
        (cd release-assets/windows && sha256sum --check SHA256SUMS.txt)
        grep -Fq "version: ${TARGET_VERSION}" release-assets/macos/latest-mac.yml
        grep -Fq "version: ${TARGET_VERSION}" release-assets/windows/latest.yml
        node scripts/desktop-update-artifact-contract.mjs \
          --platform=macos --version="$TARGET_VERSION" --directory=release-assets/macos
        node scripts/desktop-update-artifact-contract.mjs \
          --platform=windows --version="$TARGET_VERSION" --directory=release-assets/windows
        node scripts/linux/linux-release-contract.mjs \
          --version="$TARGET_VERSION" --directory=release-assets/linux
        mv release-assets/macos/SHA256SUMS.txt release-assets/macos/SHA256SUMS-macos.txt
        mv release-assets/windows/SHA256SUMS.txt release-assets/windows/SHA256SUMS-windows.txt
        mv release-assets/linux/SHA256SUMS.txt release-assets/linux/SHA256SUMS-linux.txt
    - name: Reconcile the single unpublished draft
      shell: bash
      run: |
        set -euo pipefail
        tag="v${TARGET_VERSION}"
        remote_sha="$(git ls-remote origin refs/heads/release | cut -f1)"
        test "$remote_sha" = "$TARGET_SHA"
        other_drafts="$(gh release list --limit 100 --json isDraft,tagName --jq ".[] | select(.isDraft and .tagName != \"${tag}\") | .tagName")"
        if [[ -n "$other_drafts" ]]; then
          echo "Another unpublished release draft must be retired first: $other_drafts" >&2
          exit 1
        fi
        if draft_state="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
          test "$draft_state" = "true"
          gh release edit "$tag" --target "$TARGET_SHA"
        else
          mkdir -p .tmp
          node scripts/linux/linux-experimental-copy.mjs --write=.tmp/linux-experimental-notice.md
          gh release create "$tag" --draft --title "$TARGET_VERSION" --target "$TARGET_SHA" \
            --notes-file .tmp/linux-experimental-notice.md
        fi
        test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "true"
        gh release view "$tag" --json body --jq .body > .tmp/linux-release-body.md
        node scripts/linux/linux-experimental-copy.mjs --verify=.tmp/linux-release-body.md
        existing_assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
        legacy_assets=(
          "Foliole-${TARGET_VERSION}-mac-arm64.dmg"
          "Foliole-${TARGET_VERSION}-mac-arm64.dmg.blockmap"
          "Foliole-${TARGET_VERSION}-mac-arm64.zip"
          "Foliole-${TARGET_VERSION}-mac-arm64.zip.blockmap"
          "Foliole-Setup-${TARGET_VERSION}-win-x64.exe"
          "Foliole-Setup-${TARGET_VERSION}-win-x64.exe.blockmap"
        )
        for asset in "${legacy_assets[@]}"; do
          if grep -Fxq "$asset" <<< "$existing_assets"; then
            gh release delete-asset "$tag" "$asset" --yes
          fi
        done
        gh release upload "$tag" --clobber \
          "release-assets/macos/Foliole-macOS-arm64-${TARGET_VERSION}.dmg" \
          "release-assets/macos/Foliole-macOS-arm64-${TARGET_VERSION}.dmg.blockmap" \
          "release-assets/macos/Foliole-macOS-arm64-${TARGET_VERSION}.zip" \
          "release-assets/macos/Foliole-macOS-arm64-${TARGET_VERSION}.zip.blockmap" \
          release-assets/macos/latest-mac.yml release-assets/macos/SHA256SUMS-macos.txt \
          "release-assets/windows/Foliole-Windows-x64-${TARGET_VERSION}.exe" \
          "release-assets/windows/Foliole-Windows-x64-${TARGET_VERSION}.exe.blockmap" \
          release-assets/windows/latest.yml release-assets/windows/SHA256SUMS-windows.txt \
          "release-assets/linux/Foliole-Linux-Experimental-x64-${TARGET_VERSION}.AppImage" \
          release-assets/linux/SHA256SUMS-linux.txt
        gh release view "$tag" --json assets --jq '.assets[].name' > .tmp/release-asset-names.txt
        node scripts/linux/linux-release-contract.mjs \
          --version="$TARGET_VERSION" --release-names=.tmp/release-asset-names.txt
