version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: daily
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 1
    cooldown:
      default-days: 1
    allow:
      - dependency-name: electron
    labels:
      - dependencies
    commit-message:
      prefix: deps
      prefix-development: deps-dev
