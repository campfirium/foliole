name: Hosted Quality Core

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      scope:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  common-quality:
    name: Common ${{ inputs.scope }} quality
    if: inputs.scope == 'shared'
    uses: ./.github/workflows/hosted-quality-common.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}
      scope: ${{ inputs.scope }}

  windows-quality:
    name: Windows ${{ inputs.scope }} quality
    if: inputs.scope == 'desktop'
    runs-on: windows-latest
    timeout-minutes: 120
    concurrency:
      group: quality-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-core-windows-${{ inputs.scope }}
      cancel-in-progress: false
    env:
      CI: "true"
      FOLIOLE_DESKTOP_NATIVE_SKIP_BUILD: "1"
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify target SHA
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${env:TARGET_SHA}") {
            throw "Checked out SHA does not match TARGET_SHA"
          }
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Activate pinned npm
        run: node scripts/quality/pinned-npm.mjs activate
      - name: Verify fixed Windows x64 context
        id: context
        env:
          GITHUB_SHA: ${{ env.TARGET_SHA }}
        run: node scripts/windows/windows-ci-evidence.mjs verify
      - name: Install dependencies
        id: npm_ci
        run: node scripts/quality/hosted-npm-ci.mjs
      - name: Run dependency hardening checks
        id: dependency_hardening
        run: npm run deps:hardening:check
      - name: Rebuild and verify Electron native ABI
        id: native_abi
        run: |
          npm run electron:rebuild:native
          node scripts/electron-sqlite-runner.mjs --preflight
      - name: Run desktop quality
        id: desktop_quality
        run: npm run quality:desktop
      - name: Write SHA-bound Windows core evidence
        if: ${{ always() }}
        env:
          GITHUB_SHA: ${{ env.TARGET_SHA }}
          CONTEXT_OUTCOME: ${{ steps.context.outcome }}
          NPM_CI_OUTCOME: ${{ steps.npm_ci.outcome }}
          DEPENDENCY_HARDENING_OUTCOME: ${{ steps.dependency_hardening.outcome }}
          NATIVE_ABI_OUTCOME: ${{ steps.native_abi.outcome }}
          DESKTOP_BUILD_OUTCOME: skipped
          DESKTOP_QUALITY_OUTCOME: ${{ steps.desktop_quality.outcome }}
          WINDOWS_CORE_OUTCOME: skipped
          WINDOWS_TAIL_OUTCOME: skipped
          PLAYWRIGHT_OUTCOME: skipped
        run: node scripts/windows/windows-ci-evidence.mjs write
      - name: Upload SHA-bound Windows core evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-core-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: |
            .tmp/artifacts/windows-ci-evidence
            .tmp/logs/quality-gate
          if-no-files-found: warn
          retention-days: 14

  linux-package-acceptance:
    name: Linux Experimental package acceptance
    if: inputs.scope == 'desktop'
    permissions: { artifact-metadata: write, attestations: write, contents: read, id-token: write }
    uses: ./.github/workflows/release-linux.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      target_version: ''
      trigger_ref: ${{ inputs.trigger_ref }}
      attest_artifact: false

  android-quality:
    name: Android ${{ inputs.scope }} quality
    if: inputs.scope == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: quality-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-core-android-${{ inputs.scope }}
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      FOLIOLE_ANDROID_HOST_MODE: native-linux
    steps:
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify target SHA
        run: test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java 21 for Android host checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: node scripts/quality/hosted-npm-ci.mjs
      - name: Rebuild Electron native ABI for Android contract tests
        run: npm run electron:rebuild:native
      - name: Run Android quality
        run: npm run quality:android
      - name: Upload Android quality logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: .tmp/logs/quality-gate
          if-no-files-found: ignore
          retention-days: 14

  ios-quality:
    name: iOS ${{ inputs.scope }} quality
    if: inputs.scope == 'ios'
    uses: ./.github/workflows/hosted-quality-ios.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}
      scope: ${{ inputs.scope }}
