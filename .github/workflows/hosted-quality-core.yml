name: Hosted Quality Core

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      scope:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  common-quality:
    name: Common ${{ inputs.scope }} quality
    if: inputs.scope == 'shared'
    uses: ./.github/workflows/hosted-quality-common.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}
      scope: ${{ inputs.scope }}

  desktop-static:
    name: Desktop static
    if: inputs.scope == 'desktop'
    uses: ./.github/workflows/hosted-quality-desktop-static.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  desktop-source-tests:
    name: Desktop source tests
    if: inputs.scope == 'desktop'
    uses: ./.github/workflows/hosted-quality-desktop-source.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  desktop-shared-tests:
    name: Desktop shared tests
    if: inputs.scope == 'desktop'
    uses: ./.github/workflows/hosted-quality-portable-domain.yml
    with:
      domain: shared
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  desktop-electron-tests:
    name: Desktop Electron tests
    if: inputs.scope == 'desktop'
    uses: ./.github/workflows/hosted-quality-electron.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  desktop-tooling-tests:
    name: Desktop tooling tests
    if: inputs.scope == 'desktop'
    uses: ./.github/workflows/hosted-quality-tooling.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  desktop-windows-core:
    name: Desktop Windows core
    if: inputs.scope == 'desktop'
    uses: ./.github/workflows/hosted-quality-windows-core.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  desktop-dependency-hardening:
    name: Desktop dependency hardening
    if: inputs.scope == 'desktop'
    uses: ./.github/workflows/hosted-quality-dependency-hardening.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  desktop-build:
    name: Desktop build
    if: inputs.scope == 'desktop'
    uses: ./.github/workflows/hosted-quality-desktop-build.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  linux-package-acceptance:
    name: Linux Experimental package acceptance
    if: inputs.scope == 'desktop'
    permissions: { artifact-metadata: write, attestations: write, contents: read, id-token: write }
    uses: ./.github/workflows/release-linux.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      target_version: ''
      trigger_ref: ${{ inputs.trigger_ref }}
      attest_artifact: false

  desktop-admission:
    name: Desktop scoped admission
    if: ${{ always() && inputs.scope == 'desktop' }}
    needs:
      - desktop-static
      - desktop-source-tests
      - desktop-shared-tests
      - desktop-electron-tests
      - desktop-tooling-tests
      - desktop-windows-core
      - desktop-dependency-hardening
      - desktop-build
      - linux-package-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize desktop scoped topology
        run: |
          echo 'T5 baseline: not applicable to scoped run' >> "$GITHUB_STEP_SUMMARY"
      - name: Require every desktop bucket
        env:
          BUILD_RESULT: ${{ needs.desktop-build.result }}
          DEPENDENCY_RESULT: ${{ needs.desktop-dependency-hardening.result }}
          DESKTOP_SOURCE_RESULT: ${{ needs.desktop-source-tests.result }}
          ELECTRON_RESULT: ${{ needs.desktop-electron-tests.result }}
          LINUX_PACKAGE_RESULT: ${{ needs.linux-package-acceptance.result }}
          SHARED_RESULT: ${{ needs.desktop-shared-tests.result }}
          STATIC_RESULT: ${{ needs.desktop-static.result }}
          TOOLING_RESULT: ${{ needs.desktop-tooling-tests.result }}
          WINDOWS_CORE_RESULT: ${{ needs.desktop-windows-core.result }}
        run: >-
          node -e 'const failed = Object.entries(process.env).filter(([key, value]) => key.endsWith("_RESULT") && value !== "success"); if (failed.length) throw new Error(failed.map(([key, value]) => `${key}=${value}`).join(", "))'

  android-quality:
    name: Android ${{ inputs.scope }} quality
    if: inputs.scope == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: quality-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-core-android-${{ inputs.scope }}
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      FOLIOLE_ANDROID_HOST_MODE: native-linux
    steps:
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify target SHA
        run: test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java 21 for Android host checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: node scripts/quality/hosted-npm-ci.mjs
      - name: Rebuild Electron native ABI for Android contract tests
        run: npm run electron:rebuild:native
      - name: Run Android quality
        run: npm run quality:android
      - name: Upload Android quality logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: .tmp/logs/quality-gate
          if-no-files-found: ignore
          retention-days: 14

  ios-quality:
    name: iOS ${{ inputs.scope }} quality
    if: inputs.scope == 'ios'
    uses: ./.github/workflows/hosted-quality-ios.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}
      scope: ${{ inputs.scope }}
