name: Hosted Quality iOS

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      scope:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string
      run_contract:
        required: false
        default: true
        type: boolean
      run_simulator:
        required: false
        default: true
        type: boolean
      simulator_matrix:
        required: false
        default: '[{"bucket":"sync-group-and-content","scenarios":["sync-group-signed-transport","content-resource-read"]},{"bucket":"state-writeback-runtime","scenarios":["state-writeback-runtime"]},{"bucket":"sync-pack-runtime","scenarios":["sync-pack-runtime"]},{"bucket":"foreground-sync-lifecycle","scenarios":["foreground-sync-lifecycle"]}]'
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: iOS contract quality
    if: inputs.run_contract
    runs-on: macos-15
    timeout-minutes: 120
    concurrency:
      group: quality-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-ios-contract-${{ inputs.scope }}
      cancel-in-progress: false
    env:
      FOLIOLE_IOS_RESOURCE_MODE: full
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify target SHA
        run: test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Activate pinned npm
        run: node scripts/quality/pinned-npm.mjs activate
      - name: Install dependencies
        run: node scripts/quality/hosted-npm-ci.mjs
      - name: Rebuild Electron native ABI for iOS contract tests
        run: npm run electron:rebuild:native
      - name: Run iOS boundary quality
        if: inputs.scope == 'full'
        run: npm run ios:sync:preflight
      - name: Run iOS contract quality
        run: npm run quality:ios:contract
      - name: Upload iOS contract logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-contract-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: .tmp/logs/quality-gate
          if-no-files-found: ignore
          retention-days: 14

  simulator:
    name: iOS Simulator (${{ matrix.bucket }})
    if: inputs.scope == 'full' && inputs.run_simulator
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.simulator_matrix) }}
    runs-on: macos-15
    timeout-minutes: 120
    concurrency:
      group: quality-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-ios-simulator-${{ matrix.bucket }}
      cancel-in-progress: false
    env:
      FOLIOLE_IOS_ACCEPTANCE_SCENARIOS: ${{ toJSON(matrix.scenarios) }}
      FOLIOLE_IOS_RESOURCE_MODE: full
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify target SHA
        run: test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Activate pinned npm
        run: node scripts/quality/pinned-npm.mjs activate
      - name: Install dependencies
        run: node scripts/quality/hosted-npm-ci.mjs
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Prepare Electron DNS-SD host
        run: npm run electron:rebuild:native
      - name: Run iOS Simulator scenario bucket
        run: node scripts/ios/ios-hosted-acceptance-bucket.mjs
      - name: Upload Sync Group transport evidence and logs
        if: ${{ always() && contains(matrix.scenarios, 'sync-group-signed-transport') }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-sync-group-signed-transport-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: |
            .tmp/artifacts/ios-bridge-acceptance/sync-group-signed-transport/summary.json
            .tmp/artifacts/ios-bridge-acceptance/sync-group-signed-transport/attempt-*/result.json
            .tmp/artifacts/ios-bridge-acceptance/sync-group-signed-transport/attempt-*/failure.json
            .tmp/artifacts/ios-bridge-acceptance/sync-group-signed-transport/attempt-*/evidence.json
            .tmp/artifacts/ios-bridge-acceptance/sync-group-signed-transport/attempt-*/attempt-evidence.json
            .tmp/artifacts/ios-bridge-acceptance/sync-group-signed-transport/attempt-*/simulator.log
            .tmp/artifacts/ios-bridge-acceptance/sync-group-signed-transport/attempt-*/simulator-owned.json
            .tmp/artifacts/ios-bridge-acceptance/sync-group-signed-transport/attempt-*/lifecycle-actions.json
            .tmp/artifacts/ios-bridge-acceptance/sync-group-signed-transport/attempt-*/service-observations.json
            .tmp/logs/quality-gate
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Upload content resource evidence and logs
        if: ${{ always() && contains(matrix.scenarios, 'content-resource-read') }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-content-resource-read-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: |
            .tmp/artifacts/ios-bridge-acceptance/content-resource-read/summary.json
            .tmp/artifacts/ios-bridge-acceptance/content-resource-read/attempt-*/result.json
            .tmp/artifacts/ios-bridge-acceptance/content-resource-read/attempt-*/failure.json
            .tmp/artifacts/ios-bridge-acceptance/content-resource-read/attempt-*/evidence.json
            .tmp/artifacts/ios-bridge-acceptance/content-resource-read/attempt-*/attempt-evidence.json
            .tmp/artifacts/ios-bridge-acceptance/content-resource-read/attempt-*/simulator.log
            .tmp/artifacts/ios-bridge-acceptance/content-resource-read/attempt-*/simulator-owned.json
            .tmp/artifacts/ios-bridge-acceptance/content-resource-read/attempt-*/lifecycle-actions.json
            .tmp/artifacts/ios-bridge-acceptance/content-resource-read/attempt-*/service-observations.json
            .tmp/logs/quality-gate
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Upload state writeback evidence and logs
        if: ${{ always() && contains(matrix.scenarios, 'state-writeback-runtime') }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-state-writeback-runtime-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: |
            .tmp/artifacts/ios-bridge-acceptance/state-writeback-runtime/summary.json
            .tmp/artifacts/ios-bridge-acceptance/state-writeback-runtime/attempt-*/result.json
            .tmp/artifacts/ios-bridge-acceptance/state-writeback-runtime/attempt-*/failure.json
            .tmp/artifacts/ios-bridge-acceptance/state-writeback-runtime/attempt-*/evidence.json
            .tmp/artifacts/ios-bridge-acceptance/state-writeback-runtime/attempt-*/attempt-evidence.json
            .tmp/artifacts/ios-bridge-acceptance/state-writeback-runtime/attempt-*/simulator.log
            .tmp/artifacts/ios-bridge-acceptance/state-writeback-runtime/attempt-*/simulator-owned.json
            .tmp/artifacts/ios-bridge-acceptance/state-writeback-runtime/attempt-*/lifecycle-actions.json
            .tmp/artifacts/ios-bridge-acceptance/state-writeback-runtime/attempt-*/service-observations.json
            .tmp/logs/quality-gate
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Upload sync pack evidence and logs
        if: ${{ always() && contains(matrix.scenarios, 'sync-pack-runtime') }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-sync-pack-runtime-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: |
            .tmp/artifacts/ios-bridge-acceptance/sync-pack-runtime/summary.json
            .tmp/artifacts/ios-bridge-acceptance/sync-pack-runtime/attempt-*/result.json
            .tmp/artifacts/ios-bridge-acceptance/sync-pack-runtime/attempt-*/failure.json
            .tmp/artifacts/ios-bridge-acceptance/sync-pack-runtime/attempt-*/evidence.json
            .tmp/artifacts/ios-bridge-acceptance/sync-pack-runtime/attempt-*/attempt-evidence.json
            .tmp/artifacts/ios-bridge-acceptance/sync-pack-runtime/attempt-*/simulator.log
            .tmp/artifacts/ios-bridge-acceptance/sync-pack-runtime/attempt-*/simulator-owned.json
            .tmp/artifacts/ios-bridge-acceptance/sync-pack-runtime/attempt-*/lifecycle-actions.json
            .tmp/artifacts/ios-bridge-acceptance/sync-pack-runtime/attempt-*/service-observations.json
            .tmp/logs/quality-gate
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
      - name: Upload foreground lifecycle evidence and logs
        if: ${{ always() && contains(matrix.scenarios, 'foreground-sync-lifecycle') }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-foreground-sync-lifecycle-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: |
            .tmp/artifacts/ios-bridge-acceptance/foreground-sync-lifecycle/summary.json
            .tmp/artifacts/ios-bridge-acceptance/foreground-sync-lifecycle/attempt-*/result.json
            .tmp/artifacts/ios-bridge-acceptance/foreground-sync-lifecycle/attempt-*/failure.json
            .tmp/artifacts/ios-bridge-acceptance/foreground-sync-lifecycle/attempt-*/evidence.json
            .tmp/artifacts/ios-bridge-acceptance/foreground-sync-lifecycle/attempt-*/attempt-evidence.json
            .tmp/artifacts/ios-bridge-acceptance/foreground-sync-lifecycle/attempt-*/simulator.log
            .tmp/artifacts/ios-bridge-acceptance/foreground-sync-lifecycle/attempt-*/simulator-owned.json
            .tmp/artifacts/ios-bridge-acceptance/foreground-sync-lifecycle/attempt-*/lifecycle-actions.json
            .tmp/artifacts/ios-bridge-acceptance/foreground-sync-lifecycle/attempt-*/service-observations.json
            .tmp/logs/quality-gate
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
