name: Hosted Windows Core Quality

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string
    outputs:
      accepted_sha:
        description: Exact commit accepted by canonical Windows core quality
        value: ${{ jobs.windows-core-admission.outputs.accepted_sha }}

permissions:
  contents: read

jobs:
  windows-core:
    name: Windows core
    runs-on: windows-latest
    timeout-minutes: 10
    concurrency:
      group: quality-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-windows-core
      cancel-in-progress: false
    env:
      CI: "true"
      FOLIOLE_DESKTOP_NATIVE_SKIP_BUILD: "1"
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Validate target SHA input
        run: node -e "if (!/^[0-9a-f]{40}$/.test(process.env.TARGET_SHA ?? '')) throw new Error('target_sha must be a full 40-character lowercase commit SHA')"
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Activate pinned npm
        run: node scripts/quality/pinned-npm.mjs activate
      - name: Install dependencies
        run: node scripts/quality/hosted-npm-ci.mjs
      - name: Verify checked-out target SHA
        run: >-
          node -e "const { execFileSync } = require('node:child_process'); const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(); if (head !== process.env.TARGET_SHA) throw new Error('Checked out SHA does not match TARGET_SHA')"
      - name: Rebuild Electron native ABI
        run: npm run electron:rebuild:native
      - name: Verify Electron sqlite runner
        run: node scripts/electron-sqlite-runner.mjs --preflight
      - name: Run canonical Windows core quality
        run: npm run quality:release:windows:core
      - name: Upload Windows core logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: t5-windows-core-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: |
            .tmp/logs/quality-gate
            .tmp/vitest
          if-no-files-found: ignore
          retention-days: 14

  windows-core-admission:
    name: Windows core admission
    if: ${{ always() }}
    needs: windows-core
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      accepted_sha: ${{ steps.require-core.outputs.accepted_sha }}
    steps:
      - name: Require canonical Windows core quality
        id: require-core
        env:
          CORE_RESULT: ${{ needs.windows-core.result }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          node -e 'if (process.env.CORE_RESULT !== "success") throw new Error(`CORE_RESULT=${process.env.CORE_RESULT}`)'
          echo "accepted_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
