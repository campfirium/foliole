name: Dev Quality Check
# Expressions cannot slice strings, so the dispatcher passes the trigger commit's 9-character
# prefix; the title only uses it when it really prefixes github.sha, otherwise both stay full.
run-name: >-
  Dev Quality Check (${{ inputs.scope }}) @ ${{
  (inputs.trigger_short != '' && startsWith(github.sha, inputs.trigger_short) && inputs.target_sha == github.sha && inputs.trigger_short)
  || (inputs.trigger_short != '' && startsWith(github.sha, inputs.trigger_short) && format('{0} via {1}', inputs.target_sha, inputs.trigger_short))
  || format('{0} via {1}', inputs.target_sha, github.sha) }}

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Explicit dev recheck scope
        required: true
        type: choice
        options:
          - desktop
          - shared
          - android
          - ios
          - full
          - replay
      stages:
        description: Explicit replay stage IDs; full always uses all
        required: false
        default: all
        type: string
      target_sha:
        description: Exact commit SHA to validate with the current dev topology
        required: true
        type: string
      trigger_short:
        description: Display-only 9-character prefix of the dev commit being dispatched
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

# The latest dev dispatch wins; release runs never join this group.
concurrency:
  group: quality-dev-remote
  cancel-in-progress: true

jobs:
  dev-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require the dev branch
        if: github.ref != 'refs/heads/dev'
        run: exit 1
      - name: Require an explicit replay selection
        if: inputs.scope == 'replay'
        env:
          STAGES: ${{ inputs.stages }}
        run: test -n "$STAGES" && test "$STAGES" != all
      - name: Validate target SHA
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: node -e "if (!/^[0-9a-f]{40}$/.test(process.env.TARGET_SHA ?? '')) throw new Error('target_sha must be a full 40-character lowercase commit SHA')"
      - name: Validate trigger short SHA
        env:
          TRIGGER_SHORT: ${{ inputs.trigger_short }}
        run: node -e "if (!/^([0-9a-f]{9})?$/.test(process.env.TRIGGER_SHORT ?? '')) throw new Error('trigger_short must be empty or a 9-character lowercase SHA prefix')"

  scoped-quality:
    if: inputs.scope != 'full' && inputs.scope != 'replay' && needs.dev-ref.result == 'success'
    needs: dev-ref
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/hosted-quality-core.yml
    with:
      execution_lane: dev-remote
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ github.ref }}
      scope: ${{ inputs.scope }}

  full-quality:
    if: (inputs.scope == 'full' || inputs.scope == 'replay') && needs.dev-ref.result == 'success'
    needs: dev-ref
    uses: ./.github/workflows/dev-quality-chain.yml
    with:
      execution_lane: dev-remote
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ github.ref }}
      stages: ${{ inputs.scope == 'replay' && inputs.stages || 'all' }}

  timing-summary:
    if: ${{ always() }}
    needs: [dev-ref, scoped-quality, full-quality]
    permissions: { actions: read, contents: read }
    uses: ./.github/workflows/hosted-quality-timing-summary.yml
    with:
      baseline_key: ${{ inputs.scope }}
      ref_name: ${{ github.ref_name }}
      topology: remote-quality
      workflow_name: Remote Quality
