name: Dev Quality Check
# Expressions cannot slice strings, so the dispatcher passes the trigger commit's 9-character
# prefix; the title only uses it when it really prefixes github.sha, otherwise both stay full.
run-name: >-
  Dev Quality Check (${{ inputs.scope }}) @ ${{
  (inputs.trigger_short != '' && startsWith(github.sha, inputs.trigger_short) && inputs.target_sha == github.sha && inputs.trigger_short)
  || (inputs.trigger_short != '' && startsWith(github.sha, inputs.trigger_short) && format('{0} via {1}', inputs.target_sha, inputs.trigger_short))
  || format('{0} via {1}', inputs.target_sha, github.sha) }}${{ inputs.mobile_distribution == 'ios' && ' [mobile:ios]' || '' }}

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Explicit dev recheck scope
        required: true
        type: choice
        options:
          - desktop
          - shared
          - android
          - ios
          - full
          - replay
      mobile_distribution:
        description: Optional mobile beta distribution after complete quality
        required: false
        default: none
        type: choice
        options: [none, ios]
      stages:
        description: Explicit replay stage IDs; full always uses all
        required: false
        default: all
        type: string
      target_sha:
        description: Exact commit SHA to validate with the current dev topology
        required: true
        type: string
      trigger_short:
        description: Display-only 9-character prefix of the dev commit being dispatched
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: read

# The latest dev dispatch wins; release runs never join this group.
concurrency:
  group: ${{ inputs.mobile_distribution == 'ios' && 'quality-qa-mobile' || (github.ref == 'refs/heads/check' && 'quality-qa' || 'quality-dev') }}
  cancel-in-progress: ${{ inputs.mobile_distribution != 'ios' }}

jobs:
  dev-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require a quality source branch
        if: github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/check'
        run: exit 1
      - name: Require the exact QA source and workflow snapshot
        if: github.ref == 'refs/heads/check'
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: test "$TARGET_SHA" = "$EVENT_SHA" && test "$TARGET_SHA" = "$WORKFLOW_SHA"
      - name: Require complete QA for mobile distribution
        env:
          MOBILE: ${{ inputs.mobile_distribution }}
          SCOPE: ${{ inputs.scope }}
        run: |
          case "$MOBILE" in
            none|'') ;;
            ios) test "$GITHUB_REF" = refs/heads/check && test "$SCOPE" = full ;;
            *) exit 1 ;;
          esac
      - name: Require an explicit replay selection
        if: inputs.scope == 'replay'
        env:
          STAGES: ${{ inputs.stages }}
        run: test -n "$STAGES" && test "$STAGES" != all
      - name: Validate target SHA
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: node -e "if (!/^[0-9a-f]{40}$/.test(process.env.TARGET_SHA ?? '')) throw new Error('target_sha must be a full 40-character lowercase commit SHA')"
      - name: Validate trigger short SHA
        env:
          TRIGGER_SHORT: ${{ inputs.trigger_short }}
        run: node -e "if (!/^([0-9a-f]{9})?$/.test(process.env.TRIGGER_SHORT ?? '')) throw new Error('trigger_short must be empty or a 9-character lowercase SHA prefix')"

  scoped-quality:
    if: inputs.scope != 'full' && inputs.scope != 'replay' && needs.dev-ref.result == 'success'
    needs: dev-ref
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/hosted-quality-core.yml
    with:
      execution_lane: dev-remote
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ github.ref }}
      scope: ${{ inputs.scope }}

  full-quality:
    if: (inputs.scope == 'full' || inputs.scope == 'replay') && needs.dev-ref.result == 'success'
    needs: dev-ref
    uses: ./.github/workflows/dev-quality-chain.yml
    with:
      execution_lane: dev-remote
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ github.ref }}
      stages: ${{ inputs.scope == 'replay' && inputs.stages || 'all' }}

  mobile-context:
    if: inputs.mobile_distribution == 'ios' && inputs.scope == 'full'
    needs: full-quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.target_sha }}', persist-credentials: false }
      - name: Require this complete chain's accepted candidate
        id: identity
        env:
          ACCEPTED_SHA: ${{ needs.full-quality.outputs.accepted_sha }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          test "$ACCEPTED_SHA" = "$TARGET_SHA"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

  mobile-ios:
    if: inputs.mobile_distribution == 'ios'
    needs: [full-quality, mobile-context]
    uses: ./.github/workflows/release-ios.yml
    with:
      target_sha: ${{ needs.full-quality.outputs.accepted_sha }}
      target_version: ${{ needs.mobile-context.outputs.version }}
      execution_lane: qa-mobile-beta
      trigger_ref: ${{ github.ref }}
    secrets:
      IOS_APP_STORE_API_ISSUER: ${{ secrets.IOS_APP_STORE_API_ISSUER }}
      IOS_APP_STORE_API_KEY_ID: ${{ secrets.IOS_APP_STORE_API_KEY_ID }}
      IOS_APP_STORE_API_KEY_BASE64: ${{ secrets.IOS_APP_STORE_API_KEY_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}

  timing-summary:
    if: ${{ always() }}
    needs: [dev-ref, scoped-quality, full-quality, mobile-context, mobile-ios]
    permissions: { actions: read, contents: read }
    uses: ./.github/workflows/hosted-quality-timing-summary.yml
    with:
      baseline_key: ${{ inputs.scope }}
      ref_name: ${{ github.ref_name }}
      topology: remote-quality
      workflow_name: Remote Quality
