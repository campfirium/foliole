name: Remote Quality
run-name: Remote Quality (${{ inputs.scope }}) @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Explicit dev recheck scope
        required: true
        type: choice
        options:
          - desktop
          - shared
          - android
          - ios
          - full

permissions:
  contents: read

concurrency:
  group: remote-quality-dev-remote-${{ github.ref }}-orchestrator
  cancel-in-progress: false

jobs:
  dev-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require the dev branch
        if: github.ref != 'refs/heads/dev'
        run: exit 1

  scoped-quality:
    if: inputs.scope != 'full' && needs.dev-ref.result == 'success'
    needs: dev-ref
    uses: ./.github/workflows/hosted-quality-core.yml
    with:
      execution_lane: dev-remote
      target_sha: ${{ github.sha }}
      trigger_ref: ${{ github.ref }}
      scope: ${{ inputs.scope }}

  t5-baseline:
    if: inputs.scope == 'full' && needs.dev-ref.result == 'success'
    needs: dev-ref
    uses: ./.github/workflows/t5-baseline-admission.yml
    with:
      execution_lane: dev-remote
      target_sha: ${{ github.sha }}
      trigger_ref: ${{ github.ref }}

  full-quality:
    if: inputs.scope == 'full' && needs.t5-baseline.result == 'success'
    needs: t5-baseline
    uses: ./.github/workflows/hosted-quality-full.yml
    with:
      execution_lane: dev-remote
      target_sha: ${{ github.sha }}
      trigger_ref: ${{ github.ref }}
