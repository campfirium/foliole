name: Remote Quality
run-name: Remote Quality (${{ inputs.scope }}) @ ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact remote commit to validate
        required: true
        type: string
      scope:
        description: Explicit recheck or release quality scope
        required: true
        type: choice
        options:
          - desktop
          - shared
          - android
          - ios
          - full

permissions:
  contents: read

concurrency:
  group: foliole-hosted-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scoped-quality:
    if: inputs.scope != 'full'
    uses: ./.github/workflows/hosted-quality-core.yml
    with:
      target_sha: ${{ inputs.target_sha }}
      scope: ${{ inputs.scope }}

  t5-baseline:
    if: inputs.scope == 'full'
    uses: ./.github/workflows/t5-baseline-admission.yml
    with:
      target_sha: ${{ inputs.target_sha }}

  full-quality:
    if: inputs.scope == 'full' && needs.t5-baseline.result == 'success'
    needs: t5-baseline
    uses: ./.github/workflows/hosted-quality-full.yml
    with:
      target_sha: ${{ inputs.target_sha }}
