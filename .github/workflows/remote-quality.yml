name: Remote Quality
run-name: Remote Quality (${{ inputs.scope }}) @ ${{ inputs.target_sha }} via ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Explicit dev recheck scope
        required: true
        type: choice
        options:
          - desktop
          - shared
          - android
          - ios
          - full
      target_sha:
        description: Exact commit SHA to validate with the current dev topology
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: remote-quality-dev-remote-${{ github.ref }}-orchestrator
  cancel-in-progress: false

jobs:
  dev-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Require the dev branch
        if: github.ref != 'refs/heads/dev'
        run: exit 1
      - name: Validate target SHA
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: node -e "if (!/^[0-9a-f]{40}$/.test(process.env.TARGET_SHA ?? '')) throw new Error('target_sha must be a full 40-character lowercase commit SHA')"

  scoped-quality:
    if: inputs.scope != 'full' && needs.dev-ref.result == 'success'
    needs: dev-ref
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/hosted-quality-core.yml
    with:
      execution_lane: dev-remote
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ github.ref }}
      scope: ${{ inputs.scope }}

  t5-baseline:
    if: inputs.scope == 'full' && needs.dev-ref.result == 'success'
    needs: dev-ref
    uses: ./.github/workflows/t5-baseline-admission.yml
    with:
      execution_lane: dev-remote
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ github.ref }}

  full-quality:
    if: inputs.scope == 'full' && needs.t5-baseline.result == 'success'
    needs: t5-baseline
    uses: ./.github/workflows/hosted-quality-full.yml
    with:
      execution_lane: dev-remote
      target_sha: ${{ needs.t5-baseline.outputs.admitted_sha }}
      trigger_ref: ${{ github.ref }}
