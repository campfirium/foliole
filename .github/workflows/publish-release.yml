name: T7 Publish Release
run-name: T7 Publish Release ${{ inputs.target_version }} @ ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Explicit package version to assemble, e.g. 0.7.2"
        required: true
        type: string
      target_sha:
        description: "Exact 40-character commit SHA targeted by the release"
        required: true
        type: string
      macos_run_id:
        description: "Successful T7 Release macOS run ID"
        required: true
        type: string
      windows_run_id:
        description: "Successful T7 Release Windows run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    name: Assemble and verify release draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out reviewed release metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Verify declared release target
        env:
          FOLIOLE_RELEASE_EVENT_NAME: ${{ github.event_name }}
          FOLIOLE_RELEASE_REF_NAME: ${{ github.ref_name }}
          FOLIOLE_RELEASE_RUN_SHA: ${{ github.sha }}
          FOLIOLE_RELEASE_TARGET_SHA: ${{ inputs.target_sha }}
          FOLIOLE_RELEASE_TARGET_VERSION: ${{ inputs.target_version }}
        run: node scripts/release-target-contract.mjs

      - name: Verify T7 release candidate evidence
        env:
          FOLIOLE_EVIDENCE_REPOSITORY: ${{ github.repository }}
          FOLIOLE_EVIDENCE_TARGET_SHA: ${{ inputs.target_sha }}
          FOLIOLE_EVIDENCE_WORKFLOW: .github/workflows/release-candidate-quality.yml
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-workflow-evidence.mjs

      - name: Verify T7 macOS packaging evidence
        env:
          FOLIOLE_EVIDENCE_REPOSITORY: ${{ github.repository }}
          FOLIOLE_EVIDENCE_RUN_ID: ${{ inputs.macos_run_id }}
          FOLIOLE_EVIDENCE_TARGET_SHA: ${{ inputs.target_sha }}
          FOLIOLE_EVIDENCE_WORKFLOW: .github/workflows/release-macos.yml
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-workflow-evidence.mjs

      - name: Verify T7 Windows packaging evidence
        env:
          FOLIOLE_EVIDENCE_REPOSITORY: ${{ github.repository }}
          FOLIOLE_EVIDENCE_RUN_ID: ${{ inputs.windows_run_id }}
          FOLIOLE_EVIDENCE_TARGET_SHA: ${{ inputs.target_sha }}
          FOLIOLE_EVIDENCE_WORKFLOW: .github/workflows/release-windows.yml
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-workflow-evidence.mjs

      - name: Verify source artifacts
        shell: bash
        run: |
          set -euo pipefail
          macos_run_id="${{ inputs.macos_run_id }}"
          windows_run_id="${{ inputs.windows_run_id }}"

          [[ "$macos_run_id" =~ ^[0-9]+$ ]]
          [[ "$windows_run_id" =~ ^[0-9]+$ ]]

          verify_artifact() {
            local run_id="$1" artifact_name="$2"
            local artifact_count
            artifact_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" --jq "[.artifacts[] | select(.name == \"${artifact_name}\" and .expired == false)] | length")"
            [[ "$artifact_count" == "1" ]]
          }

          verify_artifact "$macos_run_id" foliole-macos-release
          verify_artifact "$windows_run_id" foliole-windows-release

      - name: Download macOS release artifacts
        uses: actions/download-artifact@v5
        with:
          name: foliole-macos-release
          path: release-assets/macos
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.macos_run_id }}

      - name: Download Windows release artifacts
        uses: actions/download-artifact@v5
        with:
          name: foliole-windows-release
          path: release-assets/windows
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.windows_run_id }}

      - name: Verify and name public release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.target_version }}"
          macos_root=release-assets/macos
          windows_root=release-assets/windows

          test -f "$macos_root/Foliole-${version}-mac-arm64.dmg"
          test -f "$macos_root/Foliole-${version}-mac-arm64.dmg.blockmap"
          test -f "$macos_root/Foliole-${version}-mac-arm64.zip"
          test -f "$macos_root/Foliole-${version}-mac-arm64.zip.blockmap"
          test -f "$macos_root/latest-mac.yml"
          (cd "$macos_root" && sha256sum --check SHA256SUMS.txt)

          test -f "$windows_root/Foliole-Setup-${version}-win-x64.exe"
          test -f "$windows_root/Foliole-Setup-${version}-win-x64.exe.blockmap"
          test -f "$windows_root/latest.yml"
          (cd "$windows_root" && sha256sum --check SHA256SUMS.txt)

          grep -Fq "version: ${version}" "$macos_root/latest-mac.yml"
          grep -Fq "version: ${version}" "$windows_root/latest.yml"
          mv "$macos_root/SHA256SUMS.txt" "$macos_root/SHA256SUMS-macos.txt"
          mv "$windows_root/SHA256SUMS.txt" "$windows_root/SHA256SUMS-windows.txt"

      - name: Create inspected release draft
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.target_version }}"
          tag="v${version}"
          notes_file="releases/github/${tag}.md"
          test -f "$notes_file"
          gh release create "$tag" \
            release-assets/macos/Foliole-${version}-mac-arm64.dmg \
            release-assets/macos/Foliole-${version}-mac-arm64.dmg.blockmap \
            release-assets/macos/Foliole-${version}-mac-arm64.zip \
            release-assets/macos/Foliole-${version}-mac-arm64.zip.blockmap \
            release-assets/macos/latest-mac.yml \
            release-assets/macos/SHA256SUMS-macos.txt \
            release-assets/windows/Foliole-Setup-${version}-win-x64.exe \
            release-assets/windows/Foliole-Setup-${version}-win-x64.exe.blockmap \
            release-assets/windows/latest.yml \
            release-assets/windows/SHA256SUMS-windows.txt \
            --draft \
            --title "$version" \
            --target "${{ inputs.target_sha }}" \
            --notes-file "$notes_file"
