name: Distribute Android to Play open testing
on:
  workflow_call:
    inputs:
      target_sha: { required: true, type: string }
      target_version: { required: true, type: string }
      execution_lane: { required: true, type: string }
      trigger_ref: { required: true, type: string }
    secrets:
      ANDROID_PLAY_SERVICE_ACCOUNT_JSON: { required: true }
      ANDROID_UPLOAD_KEYSTORE_BASE64: { required: true }
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: { required: true }
      ANDROID_UPLOAD_KEY_ALIAS: { required: true }
    outputs:
      submission_state:
        value: ${{ jobs.submission.outputs.submission_state }}
      artifact_name:
        value: ${{ jobs.delivery.outputs.artifact_name }}
      packaged_sha:
        value: ${{ jobs.delivery.outputs.packaged_sha }}
permissions: { contents: read, actions: read, deployments: read }
concurrency: { group: play-android-open-testing, cancel-in-progress: false, queue: max }
jobs:
  admission:
    name: Admit Android submission or wait for review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, actions: read, deployments: write }
    outputs:
      proceed: ${{ steps.admit.outputs.proceed }}
      submission_state: ${{ steps.admit.outputs.submission_state }}
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_VERSION: ${{ inputs.target_version }}
      EXECUTION_LANE: ${{ inputs.execution_lane }}
      TRIGGER_REF: ${{ inputs.trigger_ref }}
      PLAY_DIRECT_UPLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 26.13.0 }
      - name: Reserve the accepted version for building before review completes
        id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/android/play-preparation.mjs
  play:
    needs: admission
    if: needs.admission.outputs.proceed == 'true'
    name: Build and sign the original Android candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      signed_artifact: ${{ steps.candidate.outputs.artifact_name }}
    permissions: { contents: read, actions: read, deployments: read }
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      ACCEPTED_SHA: ${{ inputs.target_sha }}
      TARGET_VERSION: ${{ inputs.target_version }}
      EXECUTION_LANE: ${{ inputs.execution_lane }}
      TRIGGER_REF: ${{ inputs.trigger_ref }}
      PLAY_PREBUILT: 'true'
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ inputs.target_sha }}', persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 26.13.0, cache: npm }
      - name: Require exact accepted QA identity
        run: node scripts/android/play-release.mjs guard
      - name: Restore only this run's original Play candidate
        env: { GH_TOKEN: '${{ github.token }}' }
        run: node scripts/android/play-release.mjs restore
      - name: Restore the durably reserved version without a Google edit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/android/play-release.mjs prepare
      - uses: actions/upload-artifact@v4
        with:
          name: android-play-${{ github.run_id }}-${{ github.run_attempt }}-prepared
          path: .tmp/artifacts/android-play/candidate.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '21.0.13+1', check-latest: true }
      - name: Activate pinned npm
        run: node scripts/quality/pinned-npm.mjs activate
      - name: Install Linux DNS-SD build headers
        run: sudo apt-get update && sudo apt-get install -y libavahi-client-dev
      - name: Install dependencies
        run: node scripts/quality/hosted-npm-ci.mjs
      - name: Install pinned SQLCipher toolchain
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653"'
      - name: Build the allocated production AAB without signing credentials
        run: node scripts/android/play-release.mjs build
      - name: Sign with the existing Play upload certificate
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        run: node scripts/android/play-release.mjs sign
      - name: Save immutable signed candidate before any upload
        uses: actions/upload-artifact@v4
        with:
          name: android-play-${{ github.run_id }}-${{ github.run_attempt }}-signed
          path: |
            .tmp/artifacts/android-play/candidate.json
            .tmp/artifacts/android-play/app-release-signed.aab
            .tmp/artifacts/android-play/bundle.json
          if-no-files-found: error
          retention-days: 30
      - name: Export immutable signed checkpoint identity
        id: candidate
        run: echo 'artifact_name=android-play-${{ github.run_id }}-${{ github.run_attempt }}-signed' >> "$GITHUB_OUTPUT"
  submission:
    name: Admit prepared Android upload or wait for review
    needs: play
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, actions: read, deployments: write }
    outputs:
      proceed: ${{ steps.admit.outputs.proceed }}
      submission_state: ${{ steps.admit.outputs.submission_state }}
      signed_artifact: ${{ steps.admit.outputs.signed_artifact }}
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_VERSION: ${{ inputs.target_version }}
      EXECUTION_LANE: ${{ inputs.execution_lane }}
      TRIGGER_REF: ${{ inputs.trigger_ref }}
      PLAY_PREBUILT: 'true'
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 26.13.0 }
      - name: Verify the original signed archive for upload
        id: admit
        env:
          PLAY_DIRECT_UPLOAD: 'true'
          GH_TOKEN: ${{ github.token }}
        run: node scripts/android/play-admission.mjs
  delivery:
    name: Deliver the durable Android candidate
    needs: [play, submission]
    if: needs.submission.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, actions: read, deployments: write }
    outputs:
      artifact_name: ${{ steps.deliver.outputs.artifact_name }}
      packaged_sha: ${{ steps.deliver.outputs.packaged_sha }}
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      TARGET_VERSION: ${{ inputs.target_version }}
      EXECUTION_LANE: ${{ inputs.execution_lane }}
      TRIGGER_REF: ${{ inputs.trigger_ref }}
      CANDIDATE_ARTIFACT: ${{ needs.submission.outputs.signed_artifact }}
    steps:
      - name: Execute only trusted default-branch delivery code
        uses: actions/checkout@v4
        with: { ref: dev, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 26.13.0 }
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: '21.0.13+1', check-latest: true }
      - name: Prepare Android inspection tools
        if: inputs.execution_lane == 'release-t7'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Register, deliver or reconcile the original candidate before collecting release assets
        id: deliver
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/android/play-deliver-runner.mjs
      - name: Preserve exact operation outcome for existing recovery tools
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-play-${{ github.run_id }}-${{ github.run_attempt }}-observed
          path: .tmp/artifacts/android-play/candidate.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve verified Play APK and release receipt
        if: inputs.execution_lane == 'release-t7'
        uses: actions/upload-artifact@v4
        with:
          name: release-android-${{ inputs.target_sha }}-${{ github.run_attempt }}
          path: .tmp/artifacts/android-play-release
          if-no-files-found: error
          retention-days: 30
