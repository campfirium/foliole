name: Hosted Static Quality

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string
    outputs:
      accepted_sha:
        description: Exact commit accepted by canonical static quality
        value: ${{ jobs.static-admission.outputs.accepted_sha }}

permissions:
  contents: read

jobs:
  static-quality:
    name: Ubuntu static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: quality-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-static
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Validate target SHA input
        run: node -e "if (!/^[0-9a-f]{40}$/.test(process.env.TARGET_SHA ?? '')) throw new Error('target_sha must be a full 40-character lowercase commit SHA')"
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Activate pinned npm
        run: node scripts/quality/pinned-npm.mjs activate
      - name: Install dependencies
        run: node scripts/quality/hosted-npm-ci.mjs
      - name: Verify checked-out target SHA
        run: >-
          node -e "const { execFileSync } = require('node:child_process'); const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(); if (head !== process.env.TARGET_SHA) throw new Error('Checked out SHA does not match TARGET_SHA')"
      - name: Run dependency hardening checks
        run: npm run deps:hardening:check
      - name: Rebuild Electron native ABI
        run: npm run electron:rebuild:native
      - name: Verify Electron sqlite runner
        run: node scripts/electron-sqlite-runner.mjs --preflight
      - name: Run canonical Common static quality
        run: bash scripts/quality/quality-gate-target.sh release-static
      - name: Upload static quality logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: t5-static-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: .tmp/logs/quality-gate
          if-no-files-found: ignore
          retention-days: 14

  static-admission:
    name: Static quality admission
    if: ${{ always() }}
    needs: static-quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      accepted_sha: ${{ steps.require-static.outputs.accepted_sha }}
    steps:
      - name: Require canonical static quality
        id: require-static
        env:
          STATIC_RESULT: ${{ needs.static-quality.result }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          node -e 'if (process.env.STATIC_RESULT !== "success") throw new Error(`STATIC_RESULT=${process.env.STATIC_RESULT}`)'
          echo "accepted_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
