name: Release Windows Package

run-name: Release Windows Package ${{ inputs.target_version }} @ ${{ inputs.target_sha }}

on:
  workflow_call:
    inputs:
      target_version:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string
      updater_baseline_version:
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
    outputs:
      artifact_name:
        description: Same-run Windows package artifact
        value: ${{ jobs.release-windows.outputs.artifact_name }}
      packaged_sha:
        description: Exact commit packaged for Windows
        value: ${{ jobs.release-windows.outputs.packaged_sha }}

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: package-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-windows
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build, sign, install, and attest Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.package-output.outputs.artifact_name }}
      packaged_sha: ${{ steps.package-output.outputs.packaged_sha }}
    env:
      ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
      ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_PUBLISHER_NAME: ${{ vars.ARTIFACT_SIGNING_PUBLISHER_NAME }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      FOLIOLE_WINDOWS_BUILDER_CONFIG: .tmp/electron-builder-artifact-signing.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify same-run Windows package context
        shell: pwsh
        env:
          RUN_SHA: ${{ github.sha }}
          TARGET_REF: ${{ inputs.trigger_ref }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          if ($env:TARGET_REF -ne "refs/heads/release") { throw "Release ref must be refs/heads/release" }
          if ($env:RUN_SHA -ne $env:TARGET_SHA) { throw "Run SHA does not match target SHA" }
          if ((git rev-parse HEAD) -ne $env:TARGET_SHA) { throw "Checked out SHA does not match target SHA" }
          if ($package.version -ne $env:TARGET_VERSION) { throw "Package version does not match target version" }
      - name: Install dependencies
        run: npm ci
      - name: Verify Artifact Signing configuration
        run: node scripts/windows/check-artifact-signing-config.mjs
      - name: Authenticate to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare Artifact Signing builder config
        run: node scripts/windows/write-artifact-signing-builder-config.mjs
      - name: Build and sign Windows installer
        run: npm run windows:package
      - name: Verify application and installer signatures
        run: |
          node scripts/windows/verify-artifact-signatures.mjs --root artifacts/windows/win-unpacked --extensions exe --recursive
          node scripts/windows/verify-artifact-signatures.mjs --root artifacts/windows --extensions exe
      - name: Verify packaged Windows distribution identity
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          node scripts/desktop-update-packaged-identity.mjs --version="$env:TARGET_VERSION" --asar=artifacts/windows/win-unpacked/resources/app.asar
      - name: Check out verified updater baseline
        if: inputs.updater_baseline_version != ''
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.updater_baseline_version }}
          path: .tmp/updater-baseline
          persist-credentials: false
      - name: Install verified baseline updater dependencies
        if: inputs.updater_baseline_version != ''
        working-directory: .tmp/updater-baseline
        run: npm ci --ignore-scripts
      - name: Prove verified Windows baseline consumes same-run update
        if: inputs.updater_baseline_version != ''
        env:
          BASELINE_VERSION: ${{ inputs.updater_baseline_version }}
          TARGET_VERSION: ${{ inputs.target_version }}
        shell: pwsh
        run: |
          node "scripts/desktop-update-compatibility-gate.mjs" `
            "--current-version=$env:BASELINE_VERSION" "--target-version=$env:TARGET_VERSION" `
            "--directory=artifacts/windows" `
            "--electron=.tmp/updater-baseline/node_modules/electron/dist/electron.exe" `
            "--updater-module=.tmp/updater-baseline/node_modules/electron-updater"
          if ($LASTEXITCODE -ne 0) { throw "Windows updater compatibility gate failed." }
      - name: Install signed Windows installer
        run: node scripts/windows/package-windows.mjs --install-existing
      - name: Smoke installed Windows app
        run: node scripts/windows/installed-app-smoke.mjs
      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path artifacts/windows -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not generated."
          }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash *$($installer.Name)" | Set-Content -Path artifacts/windows/SHA256SUMS.txt -Encoding ascii
      - name: Verify Windows updater artifacts
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: node scripts/desktop-update-artifact-contract.mjs --platform=windows --version="$env:TARGET_VERSION" --directory=artifacts/windows
      - name: Build and verify Windows validation kit
        env:
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/windows/windows-validation-kit-build.mjs build
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-checksums: artifacts/windows/SHA256SUMS.txt
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foliole-windows-release
          path: |
            artifacts/windows/*.exe
            artifacts/windows/*.blockmap
            artifacts/windows/latest.yml
            artifacts/windows/SHA256SUMS.txt
            artifacts/windows/validation-kit
          if-no-files-found: error
          retention-days: 14
      - name: Export Windows package artifact
        id: package-output
        shell: pwsh
        run: |
          "artifact_name=foliole-windows-release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "packaged_sha=${{ inputs.target_sha }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
