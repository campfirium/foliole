name: Release Windows

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Fixed release branch or tag to build, e.g. release/0.6.4 or v0.6.4"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release-windows:
    name: Build and publish Windows installer draft
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Verify fixed release ref
        shell: pwsh
        run: |
          $releaseRef = "${{ inputs.release_ref }}".Trim()
          if ([string]::IsNullOrWhiteSpace($releaseRef)) {
            throw "release_ref is required."
          }
          if (-not ($releaseRef.StartsWith("release/") -or $releaseRef.StartsWith("v"))) {
            throw "release_ref must be a release branch or version tag."
          }
          $head = (git rev-parse HEAD).Trim()
          $checkedOutRef = (git rev-parse --verify HEAD).Trim()
          if ($head -ne $checkedOutRef) {
            throw "Unable to verify checked out release ref."
          }
          $package = Get-Content package.json | ConvertFrom-Json
          $expectedTag = "v$($package.version)"
          if ($releaseRef.StartsWith("v") -and $releaseRef -ne $expectedTag) {
            throw "release_ref $releaseRef does not match package version tag $expectedTag."
          }
          $expectedBranch = "release/$($package.version)"
          if ($releaseRef.StartsWith("release/") -and $releaseRef -ne $expectedBranch) {
            throw "release_ref $releaseRef does not match package version $($package.version)."
          }
          Write-Host "release_ref=$releaseRef"
          Write-Host "release_commit=$head"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and install Windows installer
        run: npm run windows:package:install

      - name: Smoke installed Windows app
        run: node scripts/windows/installed-app-smoke.mjs

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path artifacts/windows -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not generated."
          }

          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash *$($installer.Name)" | Set-Content -Path artifacts/windows/SHA256SUMS.txt -Encoding ascii

      - name: Generate release copy surfaces
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $version = $package.version
          node scripts/release-copy-surfaces.mjs --version $version --out artifacts/windows

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-checksums: artifacts/windows/SHA256SUMS.txt

      - name: Publish installer draft release
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $tagName = "v$($package.version)"
          $releaseTitle = $package.version
          $installer = Get-ChildItem -Path artifacts/windows -Filter "*.exe" | Select-Object -First 1
          $checksums = Get-Item -Path artifacts/windows/SHA256SUMS.txt
          $notesFile = Get-Item -Path "artifacts/windows/release-v$($package.version)-github-body.md"
          if (-not $installer) {
            throw "Windows installer was not generated."
          }
          if (-not $checksums) {
            throw "Installer checksums were not generated."
          }
          if (-not $notesFile) {
            throw "GitHub release body was not generated."
          }

          $existingDraft = gh release view $tagName --json isDraft --jq ".isDraft" 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existingDraft -ne "true") {
              throw "Release $tagName already exists and is not a draft."
            }
            gh release delete $tagName --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to replace existing draft release $tagName."
            }
          }

          $targetCommit = (git rev-parse HEAD).Trim()
          gh release create $tagName $installer.FullName $checksums.FullName --draft --title $releaseTitle --target $targetCommit --notes-file $notesFile.FullName

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foliole-windows-release
          path: |
            artifacts/windows/*.exe
            artifacts/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
