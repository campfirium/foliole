name: Release Windows

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release-windows:
    name: Build and publish Windows installer draft
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run release:windows:package

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not generated."
          }

          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash *$($installer.Name)" | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-checksums: release/SHA256SUMS.txt

      - name: Publish installer draft release
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $tagName = "v$($package.version)"
          $releaseTitle = $package.version
          $installer = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1
          $checksums = Get-Item -Path release/SHA256SUMS.txt
          if (-not $installer) {
            throw "Windows installer was not generated."
          }
          if (-not $checksums) {
            throw "Installer checksums were not generated."
          }

          $existingDraft = gh release view $tagName --json isDraft --jq ".isDraft" 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existingDraft -ne "true") {
              throw "Release $tagName already exists and is not a draft."
            }
            gh release delete $tagName --yes
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to replace existing draft release $tagName."
            }
          }

          $notes = @"
          Windows alpha; please use test data and keep your own backup.
          "@

          gh release create $tagName $installer.FullName $checksums.FullName --draft --title $releaseTitle --notes $notes

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foliole-windows-release
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
