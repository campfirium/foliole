name: Release Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and publish Windows installer draft
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run release:windows:package

      - name: Publish installer draft release
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $tagName = "v$($package.version)"
          $releaseTitle = $package.version
          $installer = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer was not generated."
          }

          $existingDraft = gh release view $tagName --json isDraft --jq ".isDraft" 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existingDraft -ne "true") {
              throw "Release $tagName already exists and is not a draft."
            }
            gh release delete $tagName --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to replace existing draft release $tagName."
            }
          }

          gh release create $tagName $installer.FullName --draft --title $releaseTitle --notes "Private Windows installer test build."

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foliole-windows-release
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 14
