name: T5 Nightly Remote Quality

on:
  schedule:
    # 11:40 Asia/Shanghai, catching the morning work block before noon.
    - cron: '40 3 * * *'
    # 22:40 Asia/Shanghai, catching the evening work block before midnight.
    - cron: '40 14 * * *'
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact dev commit to validate
        required: true
        type: string
      target_host:
        description: Hosted quality scope
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - android
          - ios

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/hosted-quality-core.yml
    with:
      target_sha: ${{ inputs.target_sha || github.sha }}
      scope: full
      full_host: ${{ inputs.target_host || 'all' }}
