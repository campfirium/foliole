name: T5 Nightly Remote Quality

on:
  schedule:
    # 12:10 Asia/Shanghai, covering the 06:00-12:00 work block.
    - cron: '10 4 * * *'
    # 00:10 Asia/Shanghai, covering the rest of the day.
    - cron: '10 16 * * *'
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact dev commit to validate
        required: true
        type: string
      target_host:
        description: Hosted quality scope
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - android
          - ios

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/hosted-quality-core.yml
    with:
      target_sha: ${{ inputs.target_sha || github.sha }}
      scope: full
      full_host: ${{ inputs.target_host || 'all' }}
