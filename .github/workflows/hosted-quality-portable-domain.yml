name: Hosted Portable Domain Quality

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string
      domain:
        required: true
        type: string
    outputs:
      accepted_sha:
        description: Exact commit accepted by both hosts for one portable domain
        value: ${{ jobs.portable-domain-admission.outputs.accepted_sha }}

permissions:
  contents: read

jobs:
  portable-domain-tests:
    name: ${{ matrix.host }} ${{ inputs.domain }}
    if: inputs.domain == 'shared' || inputs.domain == 'android-source'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    concurrency:
      group: quality-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-${{ inputs.domain }}-${{ matrix.host }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Ubuntu
            runner: ubuntu-latest
          - host: Windows
            runner: windows-latest
    env:
      CI: "true"
      FOLIOLE_DESKTOP_NATIVE_SKIP_BUILD: "1"
      TARGET_SHA: ${{ inputs.target_sha }}
      VITEST_POOL: ${{ inputs.domain == 'android-source' && matrix.host == 'Windows' && 'forks' || 'threads' }}
    steps:
      - name: Validate target SHA input
        run: node -e "if (!/^[0-9a-f]{40}$/.test(process.env.TARGET_SHA ?? '')) throw new Error('target_sha must be a full 40-character lowercase commit SHA')"
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Activate pinned npm
        run: node scripts/quality/pinned-npm.mjs activate
      - name: Install dependencies
        run: node scripts/quality/hosted-npm-ci.mjs
      - name: Verify checked-out target SHA
        run: >-
          node -e "const { execFileSync } = require('node:child_process'); const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(); if (head !== process.env.TARGET_SHA) throw new Error('Checked out SHA does not match TARGET_SHA')"
      - name: Rebuild Electron native ABI
        run: npm run electron:rebuild:native
      - name: Verify Electron sqlite runner
        run: node scripts/electron-sqlite-runner.mjs --preflight
      - name: Run canonical shared domain
        if: inputs.domain == 'shared'
        run: npm run test:release:shared
      - name: Run canonical Android source domain
        if: inputs.domain == 'android-source'
        run: npm run test:release:android
      - name: Upload portable domain logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: portable-${{ inputs.domain }}-${{ matrix.host }}-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: |
            .tmp/logs/quality-gate
            .tmp/vitest
          if-no-files-found: ignore
          retention-days: 14

  portable-domain-admission:
    name: Portable domain admission
    if: ${{ always() }}
    needs: portable-domain-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      accepted_sha: ${{ steps.require-domain.outputs.accepted_sha }}
    steps:
      - name: Require both portable hosts
        id: require-domain
        env:
          DOMAIN_RESULT: ${{ needs.portable-domain-tests.result }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          node -e 'if (process.env.DOMAIN_RESULT !== "success") throw new Error(`DOMAIN_RESULT=${process.env.DOMAIN_RESULT}`)'
          echo "accepted_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
