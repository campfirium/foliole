name: Release Candidate Quality
run-name: Release Candidate Quality ${{ inputs.target_version || github.ref_name }} @ ${{ inputs.target_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Explicit package version to validate, e.g. 0.7.2"
        required: true
        type: string
      target_sha:
        description: "Exact 40-character commit SHA to validate"
        required: true
        type: string
  push:
    branches:
      - "release/**"

permissions:
  contents: read

concurrency:
  group: release-candidate-quality-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  release-candidate-quality:
    name: Release candidate quality
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify declared release target
        env:
          FOLIOLE_RELEASE_EVENT_NAME: ${{ github.event_name }}
          FOLIOLE_RELEASE_REF_NAME: ${{ github.ref_name }}
          FOLIOLE_RELEASE_RUN_SHA: ${{ github.sha }}
          FOLIOLE_RELEASE_TARGET_SHA: ${{ inputs.target_sha || github.sha }}
          FOLIOLE_RELEASE_TARGET_VERSION: ${{ inputs.target_version }}
        run: node scripts/release-target-contract.mjs

      - name: Install dependencies
        run: npm ci

      - name: Rebuild Electron native modules
        run: |
          npm run electron:rebuild:native
          node scripts/electron-sqlite-runner.mjs --preflight

      - name: Run release base quality
        run: npm run quality:release:base

      - name: Run desktop golden journey acceptance
        env:
          FOLIOLE_DESKTOP_NATIVE_SKIP_BUILD: "1"
        run: npm run test:e2e:desktop:rc-golden-journey
