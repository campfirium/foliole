name: Hosted Common Quality

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      scope:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  shared-quality:
    name: Shared quality
    if: inputs.scope == 'shared'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: quality-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-common-shared
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify target SHA
        run: test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild Electron native ABI
        run: npm run electron:rebuild:native
      - name: Run shared quality
        run: npm run quality:shared
      - name: Upload Shared quality logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: common-shared-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: .tmp/logs/quality-gate
          if-no-files-found: ignore
          retention-days: 14
