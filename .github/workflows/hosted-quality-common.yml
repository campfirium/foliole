name: Hosted Common Quality

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      scope:
        required: true
        type: string

permissions:
  contents: read

jobs:
  shared-quality:
    name: Shared quality
    if: inputs.scope == 'shared'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: hosted-quality-shared-${{ inputs.target_sha }}
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify target SHA
        run: test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild Electron native ABI
        run: npm run electron:rebuild:native
      - name: Run shared quality
        run: npm run quality:shared
      - name: Upload Shared quality logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: common-shared-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: .tmp/logs/quality-gate
          if-no-files-found: ignore
          retention-days: 14

  full-static:
    name: Common static
    if: inputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: hosted-quality-common-static-${{ inputs.target_sha }}
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify target SHA
        run: test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run dependency hardening checks
        run: npm run deps:hardening:check
      - name: Rebuild Electron native ABI
        run: npm run electron:rebuild:native
      - name: Run Common static quality
        run: bash scripts/quality/quality-gate-target.sh release-static
      - name: Upload Common static logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: common-static-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: .tmp/logs/quality-gate
          if-no-files-found: ignore
          retention-days: 14

  full-tests:
    name: Common tests (${{ matrix.domain }})
    if: inputs.scope == 'full'
    needs: full-static
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: desktop-source
            script: test:release:desktop-src
          - domain: android-source
            script: test:release:android
          - domain: shared
            script: test:release:shared
          - domain: electron
            script: test:desktop:electron
          - domain: quality-tooling
            script: quality:release:tooling
    concurrency:
      group: hosted-quality-common-test-${{ inputs.target_sha }}-${{ matrix.domain }}
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify target SHA
        run: test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild Electron native ABI
        run: npm run electron:rebuild:native
      - name: Run Common test domain
        run: npm run ${{ matrix.script }}
      - name: Upload Common test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: common-test-${{ matrix.domain }}-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: |
            .tmp/logs/quality-gate
            .tmp/vitest
          if-no-files-found: ignore
          retention-days: 14

  full-build:
    name: Common build
    if: inputs.scope == 'full'
    needs: full-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: hosted-quality-common-build-${{ inputs.target_sha }}
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify target SHA
        run: test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Common build
        run: bash scripts/quality/quality-gate-target.sh release-hosted-common-build
      - name: Upload Common build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: common-build-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: .tmp/logs/quality-gate
          if-no-files-found: ignore
          retention-days: 14
