name: Deploy Release Manifest

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - "releases/**"
      - ".github/workflows/deploy-release-manifest.yml"

permissions:
  contents: read

concurrency:
  group: pages-release-manifest
  cancel-in-progress: true

jobs:
  build:
    name: Package release manifest
    runs-on: ubuntu-latest
    steps:
      - name: Require merged dev metadata
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: test "$DEPLOY_REF" = "refs/heads/dev"
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify public Release at the workflow boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_version="$(node -p "require('./releases/update-manifest.json').latest")"
          published_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${latest_version}" \
            --jq 'select(.draft == false and .published_at != null) | .tag_name')"
          test "$published_tag" = "v${latest_version}"

      - name: Download and verify public updater assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_version="$(node -p "require('./releases/update-manifest.json').latest")"
          root=".tmp/public-update-assets"
          rm -rf "$root"
          mkdir -p "$root/macos" "$root/windows"
          gh release download "v${latest_version}" --dir "$root/macos" \
            --pattern "Foliole-macOS-arm64-${latest_version}.*" \
            --pattern latest-mac.yml --pattern SHA256SUMS-macos.txt
          gh release download "v${latest_version}" --dir "$root/windows" \
            --pattern "Foliole-Windows-x64-${latest_version}.*" \
            --pattern latest.yml --pattern SHA256SUMS-windows.txt
          mv "$root/macos/SHA256SUMS-macos.txt" "$root/macos/SHA256SUMS.txt"
          mv "$root/windows/SHA256SUMS-windows.txt" "$root/windows/SHA256SUMS.txt"
          node scripts/desktop-update-artifact-contract.mjs \
            --platform=macos --version="$latest_version" --directory="$root/macos"
          node scripts/desktop-update-artifact-contract.mjs \
            --platform=windows --version="$latest_version" --directory="$root/windows"

      - name: Prepare published release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-release-manifest-site.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy release manifest
        id: deployment
        uses: actions/deploy-pages@v4
