name: Deploy Release Manifest

on:
  schedule:
    - cron: '23,53 * * * *'
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      monitor:
        description: Skip deployment when the published download directory is unchanged
        required: false
        type: boolean
        default: false
  push:
    branches:
      - dev
    paths:
      - "releases/**"
      - ".github/release-platforms.json"
      - ".github/workflows/deploy-release-manifest.yml"
      - "scripts/prepare-release-manifest-site.mjs"
      - "scripts/release-download-directory.mjs"
      - "scripts/mobile/site-store-status.mjs"
      - "scripts/mobile/testflight-review-registry.mjs"
      - "scripts/mobile/sync-testflight-release-status.mjs"
      - "releases/store-candidates.json"
      - "scripts/android/play-availability.mjs"

permissions:
  contents: read

concurrency:
  group: pages-release-manifest
  cancel-in-progress: false
  queue: max

jobs:
  stores:
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: play-android-open-testing
      cancel-in-progress: false
      queue: max
    permissions: { contents: read, deployments: write }
    if: github.ref == 'refs/heads/dev' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
        with: { ref: dev, persist-credentials: false }
      - name: Record the source for both jobs
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with: { node-version: 26.13.0 }
      - name: Check the registered store builds
        env:
          GH_TOKEN: ${{ github.token }}
          IOS_APP_STORE_API_ISSUER: ${{ secrets.IOS_APP_STORE_API_ISSUER }}
          IOS_APP_STORE_API_KEY_ID: ${{ secrets.IOS_APP_STORE_API_KEY_ID }}
          IOS_APP_STORE_API_KEY_BASE64: ${{ secrets.IOS_APP_STORE_API_KEY_BASE64 }}
          ANDROID_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
        run: mkdir -p .tmp && node scripts/mobile/site-store-status.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: site-store-status
          path: .tmp/site-store-status.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: testflight-review-status
          path: .tmp/testflight-review-status.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: play-release-status
          path: .tmp/play-release-status.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  sync-testflight-release:
    needs: stores
    if: github.repository == 'campfirium/foliole'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.stores.outputs.source_sha }}', persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 26.13.0 }
      - uses: actions/download-artifact@v4
        with:
          name: testflight-review-status
          path: .tmp
      - uses: actions/download-artifact@v4
        with:
          name: play-release-status
          path: .tmp
      - name: Update verified mobile download links in GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/mobile/sync-testflight-release-status.mjs

  build:
    needs: [stores, sync-testflight-release]
    if: ${{ !cancelled() && needs.stores.result == 'success' }}
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    name: Package release manifest
    runs-on: ubuntu-latest
    steps:
      - name: Require merged dev metadata
        env:
          DEPLOY_REF: ${{ github.event_name == 'release' && 'refs/heads/dev' || github.ref }}
        run: test "$DEPLOY_REF" = "refs/heads/dev"
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.stores.outputs.source_sha }}
          fetch-depth: 2

      - name: Verify public Release at the workflow boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_version="$(node -p "require('./releases/update-manifest.json').latest")"
          published_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${latest_version}" \
            --jq 'select(.draft == false and .published_at != null) | .tag_name')"
          test "$published_tag" = "v${latest_version}"

      - name: Download and verify public updater assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_version="$(node -p "require('./releases/update-manifest.json').latest")"
          root=".tmp/public-update-assets"
          rm -rf "$root"
          mkdir -p "$root"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${latest_version}" > .tmp/public-release.json
          mapfile -t selected_assets < <(node scripts/release-asset-contract.mjs list \
            --version="$latest_version")
          download_args=()
          for asset in "${selected_assets[@]}"; do
            download_args+=(--pattern "$asset")
          done
          gh release download "v${latest_version}" --dir "$root" "${download_args[@]}"
          node scripts/release-asset-contract.mjs verify-directory \
            --version="$latest_version" --directory="$root" --published-release=.tmp/public-release.json

      - uses: actions/download-artifact@v4
        with:
          name: site-store-status
          path: .tmp

      - name: Prepare published release metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF: refs/heads/dev
          FOLIOLE_SITE_STORE_STATUS: .tmp/site-store-status.json
        run: node scripts/prepare-release-manifest-site.mjs

      - name: Compare the current directory for monitor runs
        id: compare
        env:
          TRIGGER: ${{ github.event_name }}
          MONITOR: ${{ inputs.monitor }}
        run: |
          if [[ "$TRIGGER" == "schedule" || "$MONITOR" == "true" ]]; then
            if curl -fsS --max-time 30 https://campfirium.github.io/foliole/releases/downloads.json > .tmp/current-directory.json &&
                cmp -s .tmp/current-directory.json _site/releases/downloads.json; then
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: steps.compare.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy release manifest
        id: deployment
        uses: actions/deploy-pages@v4
