name: Hosted Electron Quality

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string
    outputs:
      accepted_sha:
        description: Exact commit accepted by every Electron shard
        value: ${{ jobs.electron-admission.outputs.accepted_sha }}

permissions:
  contents: read

jobs:
  electron-tests:
    name: ${{ matrix.host }} ${{ matrix.bucket }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    concurrency:
      group: quality-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-electron-${{ matrix.host }}-${{ matrix.bucket }}-${{ github.run_id }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Ubuntu
            runner: ubuntu-latest
            bucket: database-import
            shards: [database-one, database-two, import]
          - host: Ubuntu
            runner: ubuntu-latest
            bucket: sync-heavy-services
            shards: [sync-heavy, services]
          - host: Ubuntu
            runner: ubuntu-latest
            bucket: sync-rest-ipc
            shards: [sync-rest, ipc]
          - host: Windows
            runner: windows-latest
            bucket: sync-rest
            shards: [sync-rest]
          - host: Windows
            runner: windows-latest
            bucket: sync-heavy-services
            shards: [sync-heavy, services]
          - host: Windows
            runner: windows-latest
            bucket: database-one-import
            shards: [database-one, import]
          - host: Windows
            runner: windows-latest
            bucket: database-two-ipc
            shards: [database-two, ipc]
    env:
      CI: "true"
      FOLIOLE_DESKTOP_NATIVE_SKIP_BUILD: "1"
      FOLIOLE_HOSTED_QUALITY_BUCKET_ITEMS: ${{ toJSON(matrix.shards) }}
      FOLIOLE_HOSTED_QUALITY_BUCKET_KIND: electron
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Validate target SHA input
        run: node -e "if (!/^[0-9a-f]{40}$/.test(process.env.TARGET_SHA ?? '')) throw new Error('target_sha must be a full 40-character lowercase commit SHA')"
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          # Migration fixtures compile the installed legacy revision from Git history.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Activate pinned npm
        run: node scripts/quality/pinned-npm.mjs activate
      - name: Prepare Linux native DNS-SD
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libavahi-client-dev avahi-daemon dbus
          sudo systemctl start dbus avahi-daemon
          avahi-daemon --check
      - name: Install dependencies
        run: node scripts/quality/hosted-npm-ci.mjs
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Verify checked-out target SHA
        run: >-
          node -e "const { execFileSync } = require('node:child_process'); const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(); if (head !== process.env.TARGET_SHA) throw new Error('Checked out SHA does not match TARGET_SHA')"
      - name: Rebuild Electron native ABI
        run: npm run electron:rebuild:native
      - name: Verify Electron sqlite runner
        run: node scripts/quality/hosted-electron-sqlite-preflight.mjs
      - name: Compile Electron workers
        run: npm run electron:compile
      - name: Run canonical Electron bucket
        run: node scripts/quality/hosted-quality-bucket.mjs
      - name: Upload Electron test logs
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: electron-test-${{ matrix.host }}-${{ matrix.bucket }}-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: |
            .tmp/logs/quality-gate
            .tmp/vitest
            .tmp/artifacts/t328-cost
            .tmp/artifacts/t343-request-scale.json
            .tmp/artifacts/t357-attachment-throughput.json
          if-no-files-found: ignore
          retention-days: 14

  electron-admission:
    name: Electron quality admission
    if: ${{ always() }}
    needs: electron-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      accepted_sha: ${{ steps.require-shards.outputs.accepted_sha }}
    env:
      SHARD_RESULT: ${{ needs.electron-tests.result }}
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Require every Electron shard
        id: require-shards
        run: |
          set -euo pipefail
          node -e 'if (process.env.SHARD_RESULT !== "success") throw new Error(`SHARD_RESULT=${process.env.SHARD_RESULT}`)'
          echo "accepted_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
