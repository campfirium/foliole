name: Hosted Electron Quality

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string
    outputs:
      accepted_sha:
        description: Exact commit accepted by every Electron shard
        value: ${{ jobs.electron-admission.outputs.accepted_sha }}

permissions:
  contents: read

jobs:
  electron-tests:
    name: ${{ matrix.host }} ${{ matrix.shard }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    concurrency:
      group: quality-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-electron-${{ matrix.host }}-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Ubuntu
            runner: ubuntu-latest
            shard: database
          - host: Ubuntu
            runner: ubuntu-latest
            shard: import
          - host: Ubuntu
            runner: ubuntu-latest
            shard: ipc
          - host: Ubuntu
            runner: ubuntu-latest
            shard: services
          - host: Windows
            runner: windows-latest
            shard: database
          - host: Windows
            runner: windows-latest
            shard: import
          - host: Windows
            runner: windows-latest
            shard: ipc
          - host: Windows
            runner: windows-latest
            shard: services
    env:
      CI: "true"
      FOLIOLE_DESKTOP_NATIVE_SKIP_BUILD: "1"
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Validate target SHA input
        run: node -e "if (!/^[0-9a-f]{40}$/.test(process.env.TARGET_SHA ?? '')) throw new Error('target_sha must be a full 40-character lowercase commit SHA')"
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify checked-out target SHA
        run: >-
          node -e "const { execFileSync } = require('node:child_process'); const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(); if (head !== process.env.TARGET_SHA) throw new Error('Checked out SHA does not match TARGET_SHA')"
      - name: Rebuild Electron native ABI
        run: npm run electron:rebuild:native
      - name: Verify Electron sqlite runner
        run: node scripts/electron-sqlite-runner.mjs --preflight
      - name: Run canonical Electron shard
        run: npm run test:desktop:electron -- ${{ matrix.shard }}
      - name: Upload Electron test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: electron-test-${{ matrix.host }}-${{ matrix.shard }}-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: |
            .tmp/logs/quality-gate
            .tmp/vitest
          if-no-files-found: ignore
          retention-days: 14

  electron-admission:
    name: Electron quality admission
    if: ${{ always() }}
    needs: electron-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      accepted_sha: ${{ steps.require-shards.outputs.accepted_sha }}
    env:
      SHARD_RESULT: ${{ needs.electron-tests.result }}
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Require every Electron shard
        id: require-shards
        run: |
          set -euo pipefail
          node -e 'if (process.env.SHARD_RESULT !== "success") throw new Error(`SHARD_RESULT=${process.env.SHARD_RESULT}`)'
          echo "accepted_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
