name: Release Stage Recheck
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  chain:
    uses: ./.github/workflows/t6-hosted-quality.yml
    with:
      execution_lane: release-t7-recheck
      stages: ${{ inputs.stage }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}
