name: Branch Push Health

on:
  push:
    branches:
      - dev
      - windows-native-codex-migration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-push-health-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      level: ${{ steps.route.outputs.level }}
      target: ${{ steps.route.outputs.target }}
      changed_files: ${{ steps.changed.outputs.changed_files }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect changed files
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ -z "${before}" || "${before}" =~ ^0+$ ]]; then
            changed="$(git diff-tree --no-commit-id --name-only -r "${after}" -- . | sort -u || true)"
          else
            changed="$(git diff --name-only "${before}" "${after}" -- . | sort -u || true)"
          fi
          {
            echo 'changed_files<<EOF'
            printf '%s\n' "${changed}"
            echo EOF
          } >> "${GITHUB_OUTPUT}"

      - name: Classify quality route
        id: route
        shell: bash
        env:
          QUALITY_GATE_CHANGED_FILES: ${{ steps.changed.outputs.changed_files }}
        run: |
          set -euo pipefail
          route_json="$(bash scripts/quality/quality-gate-fast.sh --route-json)"
          level="$(ROUTE_JSON="${route_json}" node -e "const route = JSON.parse(process.env.ROUTE_JSON); console.log(route.level)")"
          target="$(ROUTE_JSON="${route_json}" node -e "const route = JSON.parse(process.env.ROUTE_JSON); console.log(route.target)")"
          if [[ -z "${level}" ]]; then
            echo "Unable to resolve branch push quality route." >&2
            printf '%s\n' "${route_json}" >&2
            exit 1
          fi
          {
            echo "level=${level}"
            echo "target=${target}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "## Branch push health"
            echo
            echo "- scope: portable"
            echo
            echo '```json'
            printf '%s\n' "${route_json}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  routed-check:
    name: Routed advisory check
    needs: classify
    if: ${{ needs.classify.outputs.level != 'light' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run routed advisory check
        shell: bash
        env:
          QUALITY_GATE_CHANGED_FILES: ${{ needs.classify.outputs.changed_files }}
          ROUTE_LEVEL: ${{ needs.classify.outputs.level }}
          ROUTE_TARGET: ${{ needs.classify.outputs.target }}
        run: |
          set -euo pipefail
          {
            echo
            echo "## Routed advisory check"
            echo
            echo "- scope: portable"
            echo "- level: ${ROUTE_LEVEL}"
            echo "- target: ${ROUTE_TARGET}"
          } >> "${GITHUB_STEP_SUMMARY}"
          case "${ROUTE_LEVEL}" in
            mid)
              echo "- action: running Linux-safe fast gate" >> "${GITHUB_STEP_SUMMARY}"
              bash scripts/quality/quality-gate-fast.sh
              ;;
            shared)
              echo "- action: running Linux-safe shared typecheck" >> "${GITHUB_STEP_SUMMARY}"
              npm run typecheck:shared
              ;;
            desktop|android|full)
              echo "- action: summary only; run the target in the matching local/specialized runner" >> "${GITHUB_STEP_SUMMARY}"
              echo "GitHub hosted Linux runner does not run ${ROUTE_TARGET} automatically."
              ;;
            *)
              echo "Unsupported route level: ${ROUTE_LEVEL}" >&2
              exit 1
              ;;
          esac

  windows-contract:
    name: Windows contract advisory
    needs: classify
    if: ${{ needs.classify.outputs.level == 'desktop' || needs.classify.outputs.level == 'full' }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Windows contract checks
        shell: pwsh
        env:
          QUALITY_GATE_CHANGED_FILES: ${{ needs.classify.outputs.changed_files }}
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Windows contract advisory"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- scope: windows-contract"
          npm run test:files -- scripts/windows/playwright-desktop-launch-target.test.mjs scripts/windows/quality-fast-native.test.mjs scripts/windows/installed-app-smoke.test.mjs scripts/release-windows-workflow-contract.test.mjs
