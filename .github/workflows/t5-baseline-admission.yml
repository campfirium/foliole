name: T5 Baseline Admission

run-name: T5 Baseline Admission (${{ inputs.execution_lane }}) @ ${{ inputs.target_sha }}

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string
    outputs:
      admitted_sha:
        description: Exact commit admitted by every T5 bucket
        value: ${{ jobs.admission.outputs.admitted_sha }}

permissions:
  contents: read

concurrency:
  group: t5-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-admission
  cancel-in-progress: false

jobs:
  static-quality:
    name: Ubuntu static
    uses: ./.github/workflows/hosted-quality-static.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  desktop-static:
    name: Desktop static
    uses: ./.github/workflows/hosted-quality-desktop-static.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  dependency-hardening:
    name: Dependency hardening
    uses: ./.github/workflows/hosted-quality-dependency-hardening.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  windows-core:
    name: Windows core
    uses: ./.github/workflows/hosted-quality-windows-core.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  shared-tests:
    name: Portable shared tests
    uses: ./.github/workflows/hosted-quality-portable-domain.yml
    with:
      domain: shared
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  android-source-tests:
    name: Portable Android source tests
    uses: ./.github/workflows/hosted-quality-portable-domain.yml
    with:
      domain: android-source
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  desktop-source-tests:
    name: Desktop source tests
    uses: ./.github/workflows/hosted-quality-desktop-source.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  electron-tests:
    name: Electron tests
    uses: ./.github/workflows/hosted-quality-electron.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  tooling-tests:
    name: Quality tooling tests
    uses: ./.github/workflows/hosted-quality-tooling.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  admission:
    name: T5 Baseline Admission
    if: ${{ always() }}
    needs:
      - static-quality
      - desktop-static
      - dependency-hardening
      - windows-core
      - shared-tests
      - android-source-tests
      - desktop-source-tests
      - electron-tests
      - tooling-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      admitted_sha: ${{ steps.require-buckets.outputs.admitted_sha }}
    env:
      ANDROID_SOURCE_RESULT: ${{ needs.android-source-tests.result }}
      ANDROID_SOURCE_SHA: ${{ needs.android-source-tests.outputs.accepted_sha }}
      DESKTOP_SOURCE_RESULT: ${{ needs.desktop-source-tests.result }}
      DESKTOP_SOURCE_SHA: ${{ needs.desktop-source-tests.outputs.accepted_sha }}
      DESKTOP_STATIC_RESULT: ${{ needs.desktop-static.result }}
      DESKTOP_STATIC_SHA: ${{ needs.desktop-static.outputs.accepted_sha }}
      DEPENDENCY_RESULT: ${{ needs.dependency-hardening.result }}
      DEPENDENCY_SHA: ${{ needs.dependency-hardening.outputs.accepted_sha }}
      ELECTRON_RESULT: ${{ needs.electron-tests.result }}
      ELECTRON_SHA: ${{ needs.electron-tests.outputs.accepted_sha }}
      SHARED_RESULT: ${{ needs.shared-tests.result }}
      SHARED_SHA: ${{ needs.shared-tests.outputs.accepted_sha }}
      STATIC_RESULT: ${{ needs.static-quality.result }}
      STATIC_SHA: ${{ needs.static-quality.outputs.accepted_sha }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TOOLING_RESULT: ${{ needs.tooling-tests.result }}
      TOOLING_SHA: ${{ needs.tooling-tests.outputs.accepted_sha }}
      WINDOWS_CORE_RESULT: ${{ needs.windows-core.result }}
      WINDOWS_CORE_SHA: ${{ needs.windows-core.outputs.accepted_sha }}
    steps:
      - name: Require every fast lane
        id: require-buckets
        run: |
          set -euo pipefail
          node -e 'const failed = Object.entries(process.env).filter(([key, value]) => key.endsWith("_RESULT") && value !== "success"); if (failed.length) throw new Error(failed.map(([key, value]) => `${key}=${value}`).join(", "))'
          node -e 'const mismatches = Object.entries(process.env).filter(([key, value]) => key.endsWith("_SHA") && `${key.slice(0, -4)}_RESULT` in process.env && value !== process.env.TARGET_SHA); if (mismatches.length) throw new Error(mismatches.map(([key, value]) => `${key}=${value}`).join(", "))'
          echo "admitted_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
