name: Sync SQLite Capability Gates

on:
  workflow_dispatch:

jobs:
  sync-sql-surface-scan:
    name: Sync SQL surface scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan sync SQL surface
        run: npm run sync:sql-surface:scan

  ios-sqlite-capability-gate:
    name: iOS SQLite capability gate
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run iOS SQLite capability gate
        run: npm run ios:sqlite-capability:gate
