name: Scheduled Dev Quality

run-name: Scheduled Dev Quality @ ${{ github.sha }}

on:
  schedule:
    # 11:40 Asia/Shanghai, catching the morning work block before noon.
    - cron: '40 3 * * *'
    # 22:40 Asia/Shanghai, catching the evening work block before midnight.
    - cron: '40 14 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: quality-dev
  cancel-in-progress: false

jobs:
  context:
    name: Resolve scheduled dev target
    runs-on: ubuntu-latest
    outputs:
      reason: ${{ steps.admission.outputs.reason }}
      should_run: ${{ steps.admission.outputs.should_run }}
      target_sha: ${{ github.sha }}
      trigger_ref: ${{ github.ref }}
    steps:
      - name: Require the dev branch
        if: github.ref != 'refs/heads/dev'
        run: exit 1
      - name: Check out T7 admission
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve release pause, active runs, or a decisive full verdict
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          FOLIOLE_QUALITY_REPOSITORY: ${{ github.repository }}
          FOLIOLE_QUALITY_RUN_ID: ${{ github.run_id }}
          FOLIOLE_QUALITY_TARGET_SHA: ${{ github.sha }}
        run: node scripts/quality/t7-hosted-quality-admission.mjs

  skipped_notice:
    name: Scheduled dev run skipped
    needs: context
    if: needs.context.outputs.should_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain why DEV quality did not run
        env:
          ADMISSION_REASON: ${{ needs.context.outputs.reason }}
          TARGET_SHA: ${{ needs.context.outputs.target_sha }}
        run: |
          echo "## Scheduled dev run skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "Reason: \`${ADMISSION_REASON}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: \`${TARGET_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  t6_quality:
    name: Full chain
    needs: context
    if: needs.context.outputs.should_run == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/dev-quality-chain.yml
    with:
      execution_lane: dev-t7
      target_sha: ${{ needs.context.outputs.target_sha }}
      trigger_ref: ${{ needs.context.outputs.trigger_ref }}

  security_maintenance:
    name: Independent dependency security
    permissions:
      contents: write
      actions: read
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Qualification and notification use the report, before any release-gate expansion.
    continue-on-error: true
    env:
      FOLIOLE_SECURITY_TARGET_SHA: ${{ github.sha }}
      FOLIOLE_ANDROID_HOST_MODE: native-linux
    steps:
      - name: Check out the scheduled security target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify the security target
        run: test "$(git rev-parse HEAD)" = "${FOLIOLE_SECURITY_TARGET_SHA}"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
      - name: Activate pinned npm
        run: node scripts/quality/pinned-npm.mjs activate
      - name: Set up Java for native dependency resolution
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21.0.13+1'
          check-latest: true
      - name: Install Linux DNS-SD build headers
        run: sudo apt-get update && sudo apt-get install -y libavahi-client-dev
      - name: Install dependencies
        run: node scripts/quality/hosted-npm-ci.mjs
      - name: Build companion assets for dependency graph preparation
        run: npm run android:web:build
      - name: Install the SQLCipher native toolchain
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;25.2.9519653"'
      - name: Prepare the native dependency graph
        run: npm run android:sync
      - name: Generate the actual resolved Android graph
        id: android_graph
        env:
          DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: .*RuntimeClasspath
        continue-on-error: true
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: android
          dependency-graph: generate-and-upload
          cache-disabled: true
          validate-wrappers: true
          dependency-resolution-task: folioleSecurityDependencies
          additional-arguments: --no-daemon --no-configuration-cache -I ../scripts/android/android-dependency-inventory.gradle -PfolioleSecurityReport=../.tmp/artifacts/security-maintenance/hosted/submission-inventory.json
          dependency-graph-report-dir: .tmp/artifacts/security-maintenance/hosted/dependency-graph
      - name: Submit Android graph and verify effective repository update
        id: android_submission
        if: ${{ always() }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/android/android-dependency-submission.mjs
      - name: Collect current advisory and coverage evidence
        env:
          FOLIOLE_ANDROID_SUBMISSION_RECEIPT: .tmp/artifacts/security-maintenance/hosted/dependency-submission.json
        run: node scripts/security/hosted-security-maintenance.mjs
      - name: Refresh iOS evidence in the existing security artifact
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ios/hosted-ios-security-maintenance.mjs
      - name: Record a failed collection if setup prevented the reporter
        if: ${{ always() }}
        run: |
          node --input-type=module -e '
            import { existsSync, mkdirSync, writeFileSync } from "node:fs";
            const root = ".tmp/artifacts/security-maintenance/hosted";
            mkdirSync(root, { recursive: true });
            if (!existsSync(`${root}/coverage.json`) && !existsSync(`${root}/failure.json`)) {
              writeFileSync(`${root}/failure.json`, JSON.stringify({ status: "error", requestedTarget: process.env.FOLIOLE_SECURITY_TARGET_SHA, reason: "collection-unavailable-see-job-log" }));
            }
          '
      - name: Retain security evidence independently of full-quality admission
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-maintenance-${{ github.sha }}-${{ github.run_attempt }}
          path: .tmp/artifacts/security-maintenance/hosted
          if-no-files-found: error
          retention-days: 14
