name: Hosted Desktop Source Quality

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string
    outputs:
      accepted_sha:
        description: Exact commit accepted by every desktop source shard
        value: ${{ jobs.desktop-source-admission.outputs.accepted_sha }}

permissions:
  contents: read

jobs:
  desktop-source-tests:
    name: ${{ matrix.host }} ${{ matrix.bucket }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    concurrency:
      group: quality-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-desktop-source-${{ matrix.host }}-${{ matrix.bucket }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Ubuntu
            runner: ubuntu-latest
            bucket: all
            shards: [one, two, three, four]
          - host: Windows
            runner: windows-latest
            bucket: first
            shards: [one, two]
          - host: Windows
            runner: windows-latest
            bucket: second
            shards: [three, four]
    env:
      CI: "true"
      FOLIOLE_HOSTED_QUALITY_BUCKET_ITEMS: ${{ toJSON(matrix.shards) }}
      FOLIOLE_HOSTED_QUALITY_BUCKET_KIND: desktop-source
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Validate target SHA input
        run: node -e "if (!/^[0-9a-f]{40}$/.test(process.env.TARGET_SHA ?? '')) throw new Error('target_sha must be a full 40-character lowercase commit SHA')"
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Activate pinned npm
        run: node scripts/quality/pinned-npm.mjs activate
      - name: Install dependencies
        run: node scripts/quality/hosted-npm-ci.mjs
      - name: Verify checked-out target SHA
        run: >-
          node -e "const { execFileSync } = require('node:child_process'); const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(); if (head !== process.env.TARGET_SHA) throw new Error('Checked out SHA does not match TARGET_SHA')"
      - name: Run canonical desktop source bucket
        run: node scripts/quality/hosted-quality-bucket.mjs
      - name: Upload desktop source test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: desktop-source-${{ matrix.host }}-${{ matrix.bucket }}-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: .tmp/vitest
          if-no-files-found: ignore
          retention-days: 14

  desktop-source-admission:
    name: Desktop source quality admission
    if: ${{ always() }}
    needs: desktop-source-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      accepted_sha: ${{ steps.require-shards.outputs.accepted_sha }}
    env:
      SHARD_RESULT: ${{ needs.desktop-source-tests.result }}
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Require every desktop source shard
        id: require-shards
        run: |
          set -euo pipefail
          node -e 'if (process.env.SHARD_RESULT !== "success") throw new Error(`SHARD_RESULT=${process.env.SHARD_RESULT}`)'
          echo "accepted_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
