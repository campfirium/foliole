name: Hosted Full Quality

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string
    outputs:
      accepted_sha:
        description: Exact commit admitted by every full-quality job
        value: ${{ jobs.full-admission.outputs.accepted_sha }}

permissions:
  contents: read

jobs:
  desktop-build:
    name: Desktop build
    uses: ./.github/workflows/hosted-quality-desktop-build.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  android-web-build:
    name: Android web build
    uses: ./.github/workflows/hosted-quality-android-web-build.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  windows-acceptance:
    name: Windows acceptance
    runs-on: windows-latest
    timeout-minutes: 120
    concurrency:
      group: quality-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-full-windows-acceptance
      cancel-in-progress: false
    env:
      CI: "true"
      FOLIOLE_DESKTOP_NATIVE_SKIP_BUILD: "1"
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify target SHA
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${env:TARGET_SHA}") {
            throw "Checked out SHA does not match TARGET_SHA"
          }
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Activate pinned npm
        run: node scripts/quality/pinned-npm.mjs activate
      - name: Verify fixed Windows x64 context
        id: context
        env:
          GITHUB_SHA: ${{ env.TARGET_SHA }}
        run: node scripts/windows/windows-ci-evidence.mjs verify
      - name: Install dependencies
        id: npm_ci
        run: node scripts/quality/hosted-npm-ci.mjs
      - name: Rebuild and verify Electron native ABI
        id: native_abi
        run: |
          npm run electron:rebuild:native
          node scripts/electron-sqlite-runner.mjs --preflight
      - name: Build desktop acceptance outputs
        id: desktop_build
        if: ${{ !cancelled() && steps.native_abi.outcome == 'success' }}
        run: |
          npm run build:vite-only
          npm run electron:compile
      - name: Run canonical Windows host tail
        id: windows_tail
        if: ${{ !cancelled() && steps.desktop_build.outcome == 'success' }}
        run: npm run quality:release:windows:tail
      - name: Run CI-capable Electron Playwright suite
        id: playwright
        if: ${{ !cancelled() && steps.desktop_build.outcome == 'success' }}
        run: node scripts/windows/windows-ci-playwright-profile.mjs
      - name: Write SHA-bound Windows acceptance evidence
        if: ${{ always() }}
        env:
          GITHUB_SHA: ${{ env.TARGET_SHA }}
          CONTEXT_OUTCOME: ${{ steps.context.outcome }}
          NPM_CI_OUTCOME: ${{ steps.npm_ci.outcome }}
          DEPENDENCY_HARDENING_OUTCOME: skipped
          NATIVE_ABI_OUTCOME: ${{ steps.native_abi.outcome }}
          DESKTOP_BUILD_OUTCOME: ${{ steps.desktop_build.outcome }}
          DESKTOP_QUALITY_OUTCOME: skipped
          WINDOWS_CORE_OUTCOME: skipped
          WINDOWS_TAIL_OUTCOME: ${{ steps.windows_tail.outcome }}
          PLAYWRIGHT_OUTCOME: ${{ steps.playwright.outcome }}
        run: node scripts/windows/windows-ci-evidence.mjs write
      - name: Upload SHA-bound Windows acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: |
            .tmp/artifacts/windows-ci-evidence
            .tmp/playwright-results/desktop
            .tmp/playwright-report/desktop
            .tmp/artifacts/desktop-acceptance
            .tmp/logs/quality-gate
          if-no-files-found: warn
          retention-days: 14

  android-host:
    name: Android host quality
    uses: ./.github/workflows/hosted-quality-android-host.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  ios-full:
    name: iOS full quality
    uses: ./.github/workflows/hosted-quality-ios.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}
      scope: full

  full-admission:
    name: Full quality admission
    if: ${{ always() }}
    needs: [desktop-build, android-web-build, windows-acceptance, android-host, ios-full]
    runs-on: ubuntu-latest
    outputs:
      accepted_sha: ${{ steps.require-jobs.outputs.accepted_sha }}
    steps:
      - name: Require every full-quality job
        id: require-jobs
        env:
          ANDROID_RESULT: ${{ needs.android-host.result }}
          ANDROID_WEB_BUILD_RESULT: ${{ needs.android-web-build.result }}
          DESKTOP_BUILD_RESULT: ${{ needs.desktop-build.result }}
          IOS_RESULT: ${{ needs.ios-full.result }}
          TARGET_SHA: ${{ inputs.target_sha }}
          WINDOWS_RESULT: ${{ needs.windows-acceptance.result }}
        run: |
          node -e 'const failed = Object.entries(process.env).filter(([key, value]) => key.endsWith("_RESULT") && value !== "success"); if (failed.length) throw new Error(failed.map(([key, value]) => `${key}=${value}`).join(", "))'
          echo "accepted_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
