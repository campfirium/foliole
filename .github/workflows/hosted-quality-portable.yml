name: Hosted Portable Quality

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string
    outputs:
      accepted_sha:
        description: Exact commit accepted by every portable quality bucket
        value: ${{ jobs.portable-admission.outputs.accepted_sha }}

permissions:
  contents: read

jobs:
  portable-tests:
    name: ${{ matrix.host }} ${{ matrix.domain }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Ubuntu
            runner: ubuntu-latest
            domain: android-source
            script: test:release:android
            timeout_minutes: 20
          - host: Ubuntu
            runner: ubuntu-latest
            domain: shared
            script: test:release:shared
            timeout_minutes: 20
          - host: Windows
            runner: windows-latest
            domain: android-source
            script: test:release:android
            timeout_minutes: 20
          - host: Windows
            runner: windows-latest
            domain: shared
            script: test:release:shared
            timeout_minutes: 20
    env:
      CI: "true"
      FOLIOLE_DESKTOP_NATIVE_SKIP_BUILD: "1"
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Validate target SHA input
        run: node -e "if (!/^[0-9a-f]{40}$/.test(process.env.TARGET_SHA ?? '')) throw new Error('target_sha must be a full 40-character lowercase commit SHA')"
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify checked-out target SHA
        run: >-
          node -e "const { execFileSync } = require('node:child_process'); const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(); if (head !== process.env.TARGET_SHA) throw new Error('Checked out SHA does not match TARGET_SHA')"
      - name: Rebuild Electron native ABI
        run: npm run electron:rebuild:native
      - name: Verify Electron sqlite runner
        run: node scripts/electron-sqlite-runner.mjs --preflight
      - name: Run canonical test domain
        run: npm run ${{ matrix.script }}
      - name: Upload portable test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: portable-test-${{ matrix.host }}-${{ matrix.domain }}-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: |
            .tmp/logs/quality-gate
            .tmp/vitest
          if-no-files-found: ignore
          retention-days: 14

  electron-quality:
    name: Electron quality
    uses: ./.github/workflows/hosted-quality-electron.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  desktop-source-quality:
    name: Desktop source quality
    uses: ./.github/workflows/hosted-quality-desktop-source.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  tooling-quality:
    name: Quality tooling
    uses: ./.github/workflows/hosted-quality-tooling.yml
    with:
      execution_lane: ${{ inputs.execution_lane }}
      target_sha: ${{ inputs.target_sha }}
      trigger_ref: ${{ inputs.trigger_ref }}

  portable-admission:
    name: Portable quality admission
    if: ${{ always() }}
    needs: [portable-tests, desktop-source-quality, electron-quality, tooling-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      accepted_sha: ${{ steps.require-buckets.outputs.accepted_sha }}
    env:
      DESKTOP_SOURCE_RESULT: ${{ needs.desktop-source-quality.result }}
      DESKTOP_SOURCE_SHA: ${{ needs.desktop-source-quality.outputs.accepted_sha }}
      ELECTRON_RESULT: ${{ needs.electron-quality.result }}
      ELECTRON_SHA: ${{ needs.electron-quality.outputs.accepted_sha }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TEST_RESULT: ${{ needs.portable-tests.result }}
      TOOLING_RESULT: ${{ needs.tooling-quality.result }}
      TOOLING_SHA: ${{ needs.tooling-quality.outputs.accepted_sha }}
    steps:
      - name: Require every portable bucket
        id: require-buckets
        run: |
          set -euo pipefail
          node -e 'if (process.env.TEST_RESULT !== "success") throw new Error(`TEST_RESULT=${process.env.TEST_RESULT}`)'
          node -e 'if (process.env.DESKTOP_SOURCE_RESULT !== "success") throw new Error(`DESKTOP_SOURCE_RESULT=${process.env.DESKTOP_SOURCE_RESULT}`)'
          node -e 'if (process.env.DESKTOP_SOURCE_SHA !== process.env.TARGET_SHA) throw new Error("DESKTOP_SOURCE_SHA does not match portable target")'
          node -e 'if (process.env.ELECTRON_RESULT !== "success") throw new Error(`ELECTRON_RESULT=${process.env.ELECTRON_RESULT}`)'
          node -e 'if (process.env.ELECTRON_SHA !== process.env.TARGET_SHA) throw new Error("ELECTRON_SHA does not match portable target")'
          node -e 'if (process.env.TOOLING_RESULT !== "success") throw new Error(`TOOLING_RESULT=${process.env.TOOLING_RESULT}`)'
          node -e 'if (process.env.TOOLING_SHA !== process.env.TARGET_SHA) throw new Error("TOOLING_SHA does not match portable target")'
          echo "accepted_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
