name: Release macOS Package

run-name: Release macOS Package ${{ inputs.target_version }} @ ${{ inputs.target_sha }}

on:
  workflow_call:
    inputs:
      target_version:
        required: true
        type: string
      target_sha:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string
      updater_baseline_version:
        required: true
        type: string
    secrets:
      APPLE_API_ISSUER:
        required: true
      APPLE_API_KEY_ID:
        required: true
      APPLE_NOTARY_API_KEY_BASE64:
        required: true
      MACOS_CLI_DEVELOPER_ID_PROFILE_BASE64:
        required: true
      MACOS_DEVELOPER_ID_CERTIFICATE_BASE64:
        required: true
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD:
        required: true
      MACOS_DEVELOPER_ID_PROFILE_BASE64:
        required: true
    outputs:
      artifact_name:
        description: Same-run macOS package artifact
        value: ${{ jobs.release-macos.outputs.artifact_name }}
      packaged_sha:
        description: Exact commit packaged for macOS
        value: ${{ jobs.release-macos.outputs.packaged_sha }}

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: package-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-macos
  cancel-in-progress: false

jobs:
  release-macos:
    name: Build, sign, notarize, and attest macOS release
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      artifact_name: ${{ steps.package-output.outputs.artifact_name }}
      packaged_sha: ${{ steps.package-output.outputs.packaged_sha }}
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify same-run macOS package context
        env:
          RUN_SHA: ${{ github.sha }}
          TARGET_REF: ${{ inputs.trigger_ref }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: >-
          node -e "const fs = require('node:fs'); const cp = require('node:child_process'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); const head = cp.execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(); if (process.env.TARGET_REF !== 'refs/heads/release') throw new Error('Release ref must be exact'); if (process.env.RUN_SHA !== process.env.TARGET_SHA || head !== process.env.TARGET_SHA) throw new Error('macOS package SHA mismatch'); if (pkg.version !== process.env.TARGET_VERSION) throw new Error('macOS package version mismatch');"
      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "The macOS release must run on an arm64 runner." >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Install Apple signing and notarization credentials
        shell: bash
        env:
          APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          MACOS_CLI_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_CLI_DEVELOPER_ID_PROFILE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            APPLE_API_ISSUER APPLE_API_KEY_ID APPLE_NOTARY_API_KEY_BASE64
            MACOS_CLI_DEVELOPER_ID_PROFILE_BASE64
            MACOS_DEVELOPER_ID_CERTIFICATE_BASE64
            MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD
            MACOS_DEVELOPER_ID_PROFILE_BASE64
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/foliole-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          apple_api_key="$RUNNER_TEMP/AuthKey.p8"
          cli_profile="$RUNNER_TEMP/foliole-cli-developer-id.provisionprofile"
          main_profile="$RUNNER_TEMP/foliole-developer-id.provisionprofile"
          echo "APPLE_API_KEY=$apple_api_key" >> "$GITHUB_ENV"
          echo "FOLIOLE_MACOS_CLI_DEVELOPER_ID_PROVISIONING_PROFILE=$cli_profile" >> "$GITHUB_ENV"
          echo "FOLIOLE_MACOS_DEVELOPER_ID_PROVISIONING_PROFILE=$main_profile" >> "$GITHUB_ENV"
          printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$MACOS_DEVELOPER_ID_PROFILE_BASE64" | base64 --decode > "$main_profile"
          printf '%s' "$MACOS_CLI_DEVELOPER_ID_PROFILE_BASE64" | base64 --decode > "$cli_profile"
          printf '%s' "$APPLE_NOTARY_API_KEY_BASE64" | base64 --decode > "$apple_api_key"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"
      - name: Build, sign, notarize, and verify macOS release
        run: npm run macos:github:notarize
      - name: Verify macOS updater artifacts and packaged distribution identity
        env:
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          artifact_dir="artifacts/macos/github-arm64"
          zip_path="$artifact_dir/Foliole-macOS-arm64-${TARGET_VERSION}.zip"
          extract_root="$RUNNER_TEMP/foliole-update-identity"
          rm -rf "$extract_root"
          node scripts/desktop-update-artifact-contract.mjs \
            --platform=macos --version="$TARGET_VERSION" --directory="$artifact_dir"
          node scripts/desktop-update-packaged-identity.mjs \
            --version="$TARGET_VERSION" --macos-zip="$zip_path" --extract-root="$extract_root" \
            --notarized
      - name: Check out verified updater baseline
        if: inputs.updater_baseline_version != ''
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.updater_baseline_version }}
          path: .tmp/updater-baseline
          persist-credentials: false
      - name: Install verified baseline updater dependencies
        if: inputs.updater_baseline_version != ''
        working-directory: .tmp/updater-baseline
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js
      - name: Prove verified macOS baseline consumes same-run update
        if: inputs.updater_baseline_version != ''
        env:
          BASELINE_VERSION: ${{ inputs.updater_baseline_version }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          node scripts/desktop-update-compatibility-gate.mjs \
            --current-version="$BASELINE_VERSION" --target-version="$TARGET_VERSION" \
            --directory="artifacts/macos/github-arm64" \
            --electron=".tmp/updater-baseline/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron" \
            --updater-module=".tmp/updater-baseline/node_modules/electron-updater"
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/macos/github-arm64/*.dmg
            artifacts/macos/github-arm64/*.zip
      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foliole-macos-release
          path: |
            artifacts/macos/github-arm64/*.dmg
            artifacts/macos/github-arm64/*.blockmap
            artifacts/macos/github-arm64/*.zip
            artifacts/macos/github-arm64/latest-mac.yml
            artifacts/macos/github-arm64/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Export macOS package artifact
        id: package-output
        run: |
          echo "artifact_name=foliole-macos-release" >> "$GITHUB_OUTPUT"
          echo "packaged_sha=${{ inputs.target_sha }}" >> "$GITHUB_OUTPUT"
