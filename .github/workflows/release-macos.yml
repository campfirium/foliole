name: Release macOS
run-name: Release macOS ${{ inputs.target_version }} @ ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: "Explicit package version to package, e.g. 0.7.2"
        required: true
        type: string
      target_sha:
        description: "Exact 40-character commit SHA to package"
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-macos-${{ inputs.target_version }}-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  release-macos:
    name: Build, sign, notarize, and attest macOS release
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify declared release target
        env:
          FOLIOLE_RELEASE_EVENT_NAME: ${{ github.event_name }}
          FOLIOLE_RELEASE_REF_NAME: ${{ github.ref_name }}
          FOLIOLE_RELEASE_RUN_SHA: ${{ github.sha }}
          FOLIOLE_RELEASE_TARGET_SHA: ${{ inputs.target_sha }}
          FOLIOLE_RELEASE_TARGET_VERSION: ${{ inputs.target_version }}
        run: node scripts/release-target-contract.mjs

      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "The macOS release must run on an arm64 runner." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Apple signing and notarization credentials
        shell: bash
        env:
          APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
          MACOS_CLI_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_CLI_DEVELOPER_ID_PROFILE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            APPLE_API_ISSUER APPLE_API_KEY_ID APPLE_NOTARY_API_KEY_BASE64
            MACOS_CLI_DEVELOPER_ID_PROFILE_BASE64
            MACOS_DEVELOPER_ID_CERTIFICATE_BASE64
            MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD
            MACOS_DEVELOPER_ID_PROFILE_BASE64
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/foliole-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          apple_api_key="$RUNNER_TEMP/AuthKey.p8"
          cli_profile="$RUNNER_TEMP/foliole-cli-developer-id.provisionprofile"
          main_profile="$RUNNER_TEMP/foliole-developer-id.provisionprofile"
          echo "APPLE_API_KEY=$apple_api_key" >> "$GITHUB_ENV"
          echo "FOLIOLE_MACOS_CLI_DEVELOPER_ID_PROVISIONING_PROFILE=$cli_profile" >> "$GITHUB_ENV"
          echo "FOLIOLE_MACOS_DEVELOPER_ID_PROVISIONING_PROFILE=$main_profile" >> "$GITHUB_ENV"
          printf '%s' "$MACOS_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$MACOS_DEVELOPER_ID_PROFILE_BASE64" | base64 --decode > "$main_profile"
          printf '%s' "$MACOS_CLI_DEVELOPER_ID_PROFILE_BASE64" | base64 --decode > "$cli_profile"
          printf '%s' "$APPLE_NOTARY_API_KEY_BASE64" | base64 --decode > "$apple_api_key"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Build, sign, notarize, and verify macOS release
        run: npm run macos:github:notarize

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/macos/github-arm64/*.dmg
            artifacts/macos/github-arm64/*.zip

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foliole-macos-release
          path: |
            artifacts/macos/github-arm64/*.dmg
            artifacts/macos/github-arm64/*.blockmap
            artifacts/macos/github-arm64/*.zip
            artifacts/macos/github-arm64/latest-mac.yml
            artifacts/macos/github-arm64/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
