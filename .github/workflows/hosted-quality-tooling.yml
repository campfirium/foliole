name: Hosted Quality Tooling

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string
    outputs:
      accepted_sha:
        description: Exact commit accepted by every quality tooling segment
        value: ${{ jobs.tooling-admission.outputs.accepted_sha }}

permissions:
  contents: read

jobs:
  tooling-tests:
    name: ${{ matrix.host }} ${{ matrix.bucket }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    concurrency:
      group: quality-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-tooling-${{ matrix.host }}-${{ matrix.bucket }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Ubuntu
            runner: ubuntu-latest
            bucket: full
            segments: [full]
          - host: Windows
            runner: windows-latest
            bucket: core
            segments: [core-one, core-two]
          - host: Windows
            runner: windows-latest
            bucket: gate-integration-preview
            segments: [gate-one, gate-two, integration-one, integration-two, node-preview]
    env:
      CI: "true"
      FOLIOLE_DESKTOP_NATIVE_SKIP_BUILD: "1"
      FOLIOLE_HOSTED_QUALITY_BUCKET_ITEMS: ${{ toJSON(matrix.segments) }}
      FOLIOLE_HOSTED_QUALITY_BUCKET_KIND: tooling
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Validate target SHA input
        run: node -e "if (!/^[0-9a-f]{40}$/.test(process.env.TARGET_SHA ?? '')) throw new Error('target_sha must be a full 40-character lowercase commit SHA')"
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Activate pinned npm
        run: node scripts/quality/pinned-npm.mjs activate
      - name: Install dependencies
        run: node scripts/quality/hosted-npm-ci.mjs
      - name: Verify checked-out target SHA
        run: >-
          node -e "const { execFileSync } = require('node:child_process'); const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(); if (head !== process.env.TARGET_SHA) throw new Error('Checked out SHA does not match TARGET_SHA')"
      - name: Rebuild Electron native ABI
        run: npm run electron:rebuild:native
      - name: Verify Electron sqlite runner
        run: node scripts/electron-sqlite-runner.mjs --preflight
      - name: Run canonical quality tooling bucket
        run: node scripts/quality/hosted-quality-bucket.mjs
      - name: Upload quality tooling logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-tooling-${{ matrix.host }}-${{ matrix.bucket }}-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: |
            .tmp/logs/quality-gate
            .tmp/vitest
          if-no-files-found: ignore
          retention-days: 14

  tooling-admission:
    name: Quality tooling admission
    if: ${{ always() }}
    needs: tooling-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      accepted_sha: ${{ steps.require-segments.outputs.accepted_sha }}
    env:
      SEGMENT_RESULT: ${{ needs.tooling-tests.result }}
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Require every quality tooling segment
        id: require-segments
        run: |
          set -euo pipefail
          node -e 'if (process.env.SEGMENT_RESULT !== "success") throw new Error(`SEGMENT_RESULT=${process.env.SEGMENT_RESULT}`)'
          echo "accepted_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
