name: T7 Release

run-name: T7 Release @ ${{ github.sha }}

on:
  push:
    branches:
      - release
    paths-ignore:
      - "releases/github/**"
      - "releases/notes/**"
      - "releases/update-manifest.json"

permissions:
  contents: read

concurrency:
  group: foliole-t7-exclusive
  cancel-in-progress: true

jobs:
  release_context:
    name: Resolve release identity
    runs-on: ubuntu-latest
    outputs:
      updater_baseline_version: ${{ steps.identity.outputs.baseline_version }}
      updater_baseline_bootstrap: ${{ steps.identity.outputs.baseline_bootstrap }}
      target_sha: ${{ steps.identity.outputs.target_sha }}
      target_version: ${{ steps.identity.outputs.target_version }}
      trigger_ref: ${{ steps.identity.outputs.trigger_ref }}
    steps:
      - name: Check out release tip
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact release branch and versioned content
        id: identity
        env:
          FOLIOLE_RELEASE_REF_NAME: ${{ github.ref_name }}
          FOLIOLE_RELEASE_RUN_SHA: ${{ github.sha }}
        run: |
          node scripts/release-target-contract.mjs >> "$GITHUB_OUTPUT"
          node scripts/desktop-update-release-policy.mjs \
            --candidate="$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "trigger_ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"

  t6_quality:
    name: T6 hosted quality
    needs: release_context
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/t6-hosted-quality.yml
    with:
      execution_lane: release-t7
      target_sha: ${{ needs.release_context.outputs.target_sha }}
      trigger_ref: ${{ needs.release_context.outputs.trigger_ref }}

  release_candidate:
    name: Release candidate quality
    needs: [release_context, t6_quality]
    permissions:
      contents: read
    uses: ./.github/workflows/release-candidate-quality.yml
    with:
      execution_lane: release-t7
      target_sha: ${{ needs.t6_quality.outputs.accepted_sha }}
      target_version: ${{ needs.release_context.outputs.target_version }}
      trigger_ref: ${{ needs.release_context.outputs.trigger_ref }}

  macos_package:
    name: macOS package
    needs: [release_context, release_candidate]
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-macos.yml
    with:
      execution_lane: release-t7
      target_sha: ${{ needs.release_candidate.outputs.accepted_sha }}
      target_version: ${{ needs.release_context.outputs.target_version }}
      updater_baseline_version: ${{ needs.release_context.outputs.updater_baseline_version }}
      trigger_ref: ${{ needs.release_context.outputs.trigger_ref }}
    secrets:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
      MACOS_CLI_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_CLI_DEVELOPER_ID_PROFILE_BASE64 }}
      MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      MACOS_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}

  windows_package:
    name: Windows package
    needs: [release_context, release_candidate]
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-windows.yml
    with:
      execution_lane: release-t7
      target_sha: ${{ needs.release_candidate.outputs.accepted_sha }}
      target_version: ${{ needs.release_context.outputs.target_version }}
      updater_baseline_version: ${{ needs.release_context.outputs.updater_baseline_version }}
      trigger_ref: ${{ needs.release_context.outputs.trigger_ref }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  linux_package:
    name: Linux Experimental package
    needs: [release_context, release_candidate]
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-linux.yml
    with:
      attest_artifact: true
      execution_lane: release-t7
      target_sha: ${{ needs.release_candidate.outputs.accepted_sha }}
      target_version: ${{ needs.release_context.outputs.target_version }}
      trigger_ref: ${{ needs.release_context.outputs.trigger_ref }}

  assemble_draft:
    name: Assemble release draft
    needs: [release_context, macos_package, windows_package, linux_package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      LINUX_SHA: ${{ needs.linux_package.outputs.packaged_sha }}
      MACOS_SHA: ${{ needs.macos_package.outputs.packaged_sha }}
      TARGET_SHA: ${{ needs.release_context.outputs.target_sha }}
      TARGET_VERSION: ${{ needs.release_context.outputs.target_version }}
      WINDOWS_SHA: ${{ needs.windows_package.outputs.packaged_sha }}
    steps:
      - name: Check out release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_context.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Assemble the exact three-platform draft
        uses: ./.github/actions/assemble-release-draft
        with:
          linux-artifact-name: ${{ needs.linux_package.outputs.artifact_name }}
          macos-artifact-name: ${{ needs.macos_package.outputs.artifact_name }}
          windows-artifact-name: ${{ needs.windows_package.outputs.artifact_name }}
