name: T7 Release

run-name: T7 Release (${{ inputs.stage || 'full' }}) @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Exact failed release stage to recheck, or full after the narrow stage passes
        required: true
        type: choice
        options:
          - t5-static
          - t5-desktop-static
          - t5-dependency-hardening
          - t5-windows-core
          - t5-shared
          - t5-android-source
          - t5-desktop-source
          - t5-electron
          - t5-tooling
          - t6-desktop-build
          - t6-android-web-build
          - t6-windows-acceptance
          - t6-android-host
          - t6-ios-contract
          - t6-ios-sync-group-content
          - t6-ios-state-writeback
          - t6-ios-sync-pack
          - t6-ios-foreground
          - release-candidate
          - macos
          - windows
          - linux
          - assembly
          - full
      target_sha:
        description: Exact current origin/release HEAD after the repair
        required: true
        type: string
      target_version:
        description: Exact package version at the repaired release HEAD
        required: true
        type: string
  push:
    branches:
      - release
    paths-ignore:
      - "releases/github/**"
      - "releases/notes/**"
      - "releases/update-manifest.json"

permissions:
  contents: read

concurrency:
  group: foliole-t7-exclusive
  cancel-in-progress: true

jobs:
  release_context:
    name: Resolve release identity
    runs-on: ubuntu-latest
    outputs:
      macos_updater_baseline_version: ${{ steps.identity.outputs.macos_updater_baseline_version }}
      release_hard_gates: ${{ steps.identity.outputs.release_hard_gates }}
      release_make_latest: ${{ steps.identity.outputs.release_make_latest }}
      release_intent_digest: ${{ steps.identity.outputs.release_intent_digest }}
      release_scope: ${{ steps.identity.outputs.release_scope }}
      target_sha: ${{ steps.identity.outputs.target_sha }}
      target_version: ${{ steps.identity.outputs.target_version }}
      trigger_ref: ${{ steps.identity.outputs.trigger_ref }}
      windows_updater_baseline_version: ${{ steps.identity.outputs.windows_updater_baseline_version }}
    steps:
      - name: Check out release tip
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact release branch and versioned content
        id: identity
        env:
          FOLIOLE_RELEASE_REF_NAME: ${{ github.ref_name }}
          FOLIOLE_RELEASE_REQUIRE_PUBLICATION_MODE: "true"
          FOLIOLE_RELEASE_RUN_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          REQUESTED_SHA: ${{ inputs.target_sha }}
          REQUESTED_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]]; then
            test "$GITHUB_REF" = "refs/heads/release"
            test "$REQUESTED_SHA" = "$GITHUB_SHA"
            remote_sha="$(git ls-remote origin refs/heads/release | cut -f1)"
            test -n "$remote_sha"
            test "$remote_sha" = "$REQUESTED_SHA"
            test "$REQUESTED_VERSION" = "$(node -p "require('./package.json').version")"
          fi
          node scripts/release-target-contract.mjs >> "$GITHUB_OUTPUT"
          node scripts/desktop-update-release-policy.mjs \
            --candidate="$(node -p "require('./package.json').version")" > /dev/null
          echo "trigger_ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"

  quality_bucket_recheck:
    name: Quality bucket recheck
    if: startsWith(inputs.stage, 't5-') || startsWith(inputs.stage, 't6-')
    needs: release_context
    permissions: { contents: read }
    uses: ./.github/workflows/release-quality-recheck.yml
    with:
      stage: ${{ inputs.stage }}
      target_sha: ${{ needs.release_context.outputs.target_sha }}
      trigger_ref: ${{ needs.release_context.outputs.trigger_ref }}

  t6_quality:
    name: T6 hosted quality
    if: github.event_name == 'push' || inputs.stage == 'full'
    needs: release_context
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/t6-hosted-quality.yml
    with:
      execution_lane: release-t7
      target_sha: ${{ needs.release_context.outputs.target_sha }}
      trigger_ref: ${{ needs.release_context.outputs.trigger_ref }}

  release_candidate:
    name: Release candidate quality
    if: ${{ always() && needs.release_context.result == 'success' && (((github.event_name == 'push' || inputs.stage == 'full') && needs.t6_quality.result == 'success') || inputs.stage == 'release-candidate') }}
    needs: [release_context, t6_quality]
    permissions:
      contents: read
    uses: ./.github/workflows/release-candidate-quality.yml
    with:
      execution_lane: release-t7
      target_sha: ${{ inputs.stage == 'release-candidate' && needs.release_context.outputs.target_sha || needs.t6_quality.outputs.accepted_sha }}
      target_version: ${{ needs.release_context.outputs.target_version }}
      trigger_ref: ${{ needs.release_context.outputs.trigger_ref }}

  macos_package:
    name: macOS package
    if: ${{ always() && needs.release_context.result == 'success' && (((github.event_name == 'push' || inputs.stage == 'full') && needs.release_candidate.result == 'success') || inputs.stage == 'macos' || inputs.stage == 'assembly') }}
    needs: [release_context, release_candidate]
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-macos.yml
    with:
      execution_lane: release-t7
      target_sha: ${{ (inputs.stage == 'macos' || inputs.stage == 'assembly') && needs.release_context.outputs.target_sha || needs.release_candidate.outputs.accepted_sha }}
      target_version: ${{ needs.release_context.outputs.target_version }}
      updater_baseline_version: ${{ needs.release_context.outputs.macos_updater_baseline_version }}
      trigger_ref: ${{ needs.release_context.outputs.trigger_ref }}
    secrets:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
      MACOS_CLI_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_CLI_DEVELOPER_ID_PROFILE_BASE64 }}
      MACOS_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_BASE64 }}
      MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      MACOS_DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}

  windows_package:
    name: Windows package
    if: ${{ always() && needs.release_context.result == 'success' && (((github.event_name == 'push' || inputs.stage == 'full') && needs.release_candidate.result == 'success') || inputs.stage == 'windows' || inputs.stage == 'assembly') }}
    needs: [release_context, release_candidate]
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-windows.yml
    with:
      execution_lane: release-t7
      target_sha: ${{ (inputs.stage == 'windows' || inputs.stage == 'assembly') && needs.release_context.outputs.target_sha || needs.release_candidate.outputs.accepted_sha }}
      target_version: ${{ needs.release_context.outputs.target_version }}
      updater_baseline_version: ${{ needs.release_context.outputs.windows_updater_baseline_version }}
      trigger_ref: ${{ needs.release_context.outputs.trigger_ref }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  linux_package:
    name: Linux Experimental package
    if: ${{ always() && needs.release_context.result == 'success' && (((github.event_name == 'push' || inputs.stage == 'full') && needs.release_candidate.result == 'success') || inputs.stage == 'linux' || inputs.stage == 'assembly') }}
    needs: [release_context, release_candidate]
    permissions: { artifact-metadata: write, attestations: write, contents: read, id-token: write }
    uses: ./.github/workflows/release-linux.yml
    with:
      execution_lane: release-t7
      target_sha: ${{ (inputs.stage == 'linux' || inputs.stage == 'assembly') && needs.release_context.outputs.target_sha || needs.release_candidate.outputs.accepted_sha }}
      target_version: ${{ needs.release_context.outputs.target_version }}
      trigger_ref: ${{ needs.release_context.outputs.trigger_ref }}
      attest_artifact: true

  assemble_draft:
    name: Assemble release draft
    if: ${{ always() && needs.release_context.result == 'success' && (github.event_name == 'push' || inputs.stage == 'full' || inputs.stage == 'assembly') && needs.macos_package.result == 'success' && needs.windows_package.result == 'success' && needs.linux_package.result == 'success' }}
    needs: [release_context, macos_package, windows_package, linux_package]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release-assembly.yml
    with:
      linux_artifact_name: ${{ needs.linux_package.outputs.artifact_name }}
      linux_sha: ${{ needs.linux_package.outputs.packaged_sha }}
      macos_artifact_name: ${{ needs.macos_package.outputs.artifact_name }}
      macos_sha: ${{ needs.macos_package.outputs.packaged_sha }}
      release_intent_digest: ${{ needs.release_context.outputs.release_intent_digest }}
      target_sha: ${{ needs.release_context.outputs.target_sha }}
      target_version: ${{ needs.release_context.outputs.target_version }}
      windows_artifact_name: ${{ needs.windows_package.outputs.artifact_name }}
      windows_sha: ${{ needs.windows_package.outputs.packaged_sha }}

  timing_summary:
    if: ${{ always() && (github.event_name == 'push' || inputs.stage == 'full') }}
    needs: [release_context, t6_quality, release_candidate, macos_package, windows_package, linux_package, assemble_draft]
    permissions: { actions: read, contents: read }
    uses: ./.github/workflows/hosted-quality-timing-summary.yml
    with:
      ref_name: ${{ github.ref_name }}
      topology: t7-release
      workflow_name: T7 Release
