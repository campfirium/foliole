name: Hosted Quality iOS App Compile

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string
    outputs:
      accepted_sha:
        description: Exact commit whose complete iOS app compiled
        value: ${{ jobs.app-compile.outputs.accepted_sha }}

permissions:
  contents: read

jobs:
  app-compile:
    name: iOS app compile
    runs-on: macos-15
    timeout-minutes: 120
    concurrency:
      group: quality-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-ios-app-compile-${{ github.run_id }}
      cancel-in-progress: false
    outputs:
      accepted_sha: ${{ steps.accepted.outputs.accepted_sha }}
    env:
      FOLIOLE_IOS_RESOURCE_MODE: full
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify target SHA
        run: test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Activate pinned npm
        run: node scripts/quality/pinned-npm.mjs activate
      - name: Install dependencies
        run: node scripts/quality/hosted-npm-ci.mjs
      - name: Compile the complete iOS app without launching a simulator
        run: node scripts/ios/ios-unsigned-app-compile.mjs
      - name: Upload iOS app compile logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-compile-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: .tmp/logs/quality-gate
          if-no-files-found: ignore
          retention-days: 14
      - name: Export accepted SHA
        id: accepted
        run: echo "accepted_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
