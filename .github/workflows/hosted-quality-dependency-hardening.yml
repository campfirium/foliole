name: Hosted Dependency Hardening

on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      execution_lane:
        required: true
        type: string
      trigger_ref:
        required: true
        type: string
    outputs:
      accepted_sha:
        description: Exact commit accepted by dependency hardening
        value: ${{ jobs.hardening-admission.outputs.accepted_sha }}

permissions:
  contents: read

jobs:
  dependency-hardening:
    name: Ubuntu dependency hardening
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: quality-${{ inputs.execution_lane }}-${{ inputs.trigger_ref }}-dependency-hardening
      cancel-in-progress: false
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Validate target SHA input
        run: node -e "if (!/^[0-9a-f]{40}$/.test(process.env.TARGET_SHA ?? '')) throw new Error('target_sha must be a full 40-character lowercase commit SHA')"
      - name: Check out target snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Activate pinned npm
        run: node scripts/quality/pinned-npm.mjs activate
      - name: Install dependencies
        run: node scripts/quality/hosted-npm-ci.mjs
      - name: Verify checked-out target SHA
        run: >-
          node -e "const { execFileSync } = require('node:child_process'); const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(); if (head !== process.env.TARGET_SHA) throw new Error('Checked out SHA does not match TARGET_SHA')"
      - name: Run dependency hardening checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run deps:hardening:check

  hardening-admission:
    name: Dependency hardening admission
    if: ${{ always() }}
    needs: dependency-hardening
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      accepted_sha: ${{ steps.require-hardening.outputs.accepted_sha }}
    steps:
      - name: Require dependency hardening
        id: require-hardening
        env:
          HARDENING_RESULT: ${{ needs.dependency-hardening.result }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          node -e 'if (process.env.HARDENING_RESULT !== "success") throw new Error(`HARDENING_RESULT=${process.env.HARDENING_RESULT}`)'
          echo "accepted_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
