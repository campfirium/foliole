body:
  - type: markdown
    attributes:
      value: |
        Vote on requests whose value is unclear to help guide priority.
  - type: input
    id: question
    attributes:
      label: Poll question
      description: Which request should people vote on?
      placeholder: Should Foliole support this workflow?
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: List the choices people should vote on, including a way to vote against the request.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Request context
      description: Explain the request and what is unclear about its value.
    validations:
      required: false
