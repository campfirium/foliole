<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foliole</title>
    <style>
      :root {
        --startup-rail-width: 40px;
        --startup-list-width: 506px;
        --startup-list-current-width: var(--startup-list-width);
        --startup-right-sidebar-width: 342px;
        --startup-right-sidebar-current-width: var(--startup-right-sidebar-width);
        --startup-titlebar-height: 40px;
        --startup-divider: rgba(32, 33, 36, 0.18);
        --startup-titlebar-bg: #fcfcfc;
        --startup-list-bg: #eef0ec;
        --startup-document-bg: #ffffff;
        --startup-sidebar-bg: #f6f6f6;
        /*STARTUP_INJECTED_CSS*/
        color: #202124;
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable', 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC',
          sans-serif;
      }

      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--startup-document-bg);
      }

      body[data-boot-skeleton='hidden'] #boot-skeleton {
        display: none;
      }

      .startup-shell {
        display: grid;
        position: fixed;
        inset: 0;
        min-height: 100%;
        grid-template-rows: var(--startup-titlebar-height) minmax(0, 1fr);
        overflow: hidden;
        z-index: 2147483647;
      }

      .startup-shell__titlebar {
        display: grid;
        grid-template-columns:
          var(--startup-rail-width)
          var(--startup-list-current-width)
          minmax(0, 1fr)
          var(--startup-right-sidebar-current-width);
        min-height: var(--startup-titlebar-height);
        background:
          linear-gradient(
            to right,
            var(--startup-list-bg) 0,
            var(--startup-list-bg) calc(var(--startup-rail-width) + var(--startup-list-current-width)),
            var(--startup-document-bg) calc(var(--startup-rail-width) + var(--startup-list-current-width)),
            var(--startup-document-bg) calc(100% - var(--startup-right-sidebar-current-width)),
            var(--startup-titlebar-bg) calc(100% - var(--startup-right-sidebar-current-width)),
            var(--startup-titlebar-bg) 100%
          );
      }

      .startup-shell__body {
        display: grid;
        grid-template-columns:
          var(--startup-rail-width)
          var(--startup-list-current-width)
          minmax(0, 1fr)
          var(--startup-right-sidebar-current-width);
        min-height: 0;
        overflow: hidden;
      }

      .startup-shell__rail {
        background: var(--startup-list-bg);
      }

      .startup-shell__list {
        background: var(--startup-list-bg);
      }

      .startup-shell__document {
        background: var(--startup-document-bg);
      }

      .startup-shell__sidebar {
        background: var(--startup-sidebar-bg);
      }

      .startup-shell__divider {
        display: none;
      }

      @media (max-width: 1279px) {
        :root {
          --startup-right-sidebar-current-width: 0px;
        }

        .startup-shell__body {
          grid-template-columns: var(--startup-rail-width) var(--startup-list-current-width) minmax(0, 1fr);
        }

        .startup-shell__sidebar {
          display: none;
        }
      }

      @media (max-width: 1079px) {
        :root {
          --startup-list-current-width: 0px;
        }

        .startup-shell__titlebar,
        .startup-shell__body {
          grid-template-columns: minmax(0, 1fr);
        }

        .startup-shell__rail,
        .startup-shell__list,
        .startup-shell__sidebar {
          display: none;
        }
      }
    </style>
    <script>
      /*STARTUP_INJECTED_BOOT_SCRIPT*/
    </script>
  </head>
  <body>
    <section id="boot-skeleton" aria-hidden="true" class="startup-shell">
      <div class="startup-shell__titlebar"></div>
      <div class="startup-shell__body">
        <div class="startup-shell__rail"></div>
        <div class="startup-shell__list"></div>
        <main class="startup-shell__document"></main>
        <aside class="startup-shell__sidebar"></aside>
      </div>
    </section>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
