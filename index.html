<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foliole</title>
    <style>
      :root {
        --startup-rail-width: 40px;
        --startup-list-width: 450px;
        --startup-list-current-width: var(--startup-list-width);
        --startup-right-sidebar-width: 250px;
        --startup-right-sidebar-current-width: var(--startup-right-sidebar-width);
        --startup-titlebar-height: 40px;
        --startup-folder-column-width: 200px;
        --startup-divider: rgba(32, 33, 36, 0.18);
        --startup-titlebar-bg: #fcfcfc;
        --startup-list-bg: #eef0ec;
        --startup-document-bg: #ffffff;
        --startup-sidebar-bg: #f6f6f6;
        --workspace-rail-width: var(--startup-rail-width);
        --workspace-folder-column-width: var(--startup-folder-column-width);
        --workspace-list-current-width: var(--startup-list-current-width);
        --workspace-list-folder-current-width: min(var(--workspace-folder-column-width), var(--workspace-list-current-width));
        --workspace-titlebar-folder-column-width: var(--workspace-list-folder-current-width);
        --workspace-titlebar-list-current-width: var(--workspace-list-current-width);
        --workspace-right-sidebar-current-width: var(--startup-right-sidebar-current-width);
        --workspace-divider-mix-target: black;
        --workspace-divider-subtle-surface-weight: 92%;
        --workspace-region-titlebar-rail-bg: var(--startup-titlebar-bg);
        --workspace-region-titlebar-folder-bg: var(--startup-titlebar-bg);
        --workspace-region-titlebar-topic-bg: var(--startup-titlebar-bg);
        --workspace-region-titlebar-document-bg: var(--startup-titlebar-bg);
        --workspace-region-titlebar-sidebar-bg: var(--startup-titlebar-bg);
        --workspace-region-main-rail-bg: var(--startup-list-bg);
        --workspace-region-main-folder-bg: var(--startup-list-bg);
        --workspace-region-main-topic-bg: var(--startup-list-bg);
        --workspace-region-main-document-bg: var(--startup-document-bg);
        --workspace-region-main-sidebar-bg: var(--startup-sidebar-bg);
        --startup-region-titlebar-rail-bg: var(--startup-titlebar-bg);
        --startup-region-titlebar-folder-bg: var(--startup-titlebar-bg);
        --startup-region-titlebar-topic-bg: var(--startup-titlebar-bg);
        --startup-region-titlebar-document-bg: var(--startup-titlebar-bg);
        --startup-region-titlebar-sidebar-bg: var(--startup-titlebar-bg);
        --startup-region-main-rail-bg: var(--startup-list-bg);
        --startup-region-main-folder-bg: var(--startup-list-bg);
        --startup-region-main-topic-bg: var(--startup-list-bg);
        --startup-region-main-document-bg: var(--startup-document-bg);
        --startup-region-main-sidebar-bg: var(--startup-sidebar-bg);
        /*STARTUP_INJECTED_CSS*/
        color: #202124;
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable', 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC',
          sans-serif;
      }

      html,
      body,
      #root {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--startup-document-bg);
      }

      body[data-boot-skeleton='hidden'] #boot-skeleton {
        display: none;
      }

      .startup-shell {
        box-sizing: border-box;
        display: grid;
        position: fixed;
        inset: 0;
        min-height: 100%;
        grid-template-rows: var(--startup-titlebar-height) minmax(0, 1fr);
        background: var(--startup-region-main-document-bg);
        overflow: hidden;
        z-index: 2147483647;
      }

      .startup-shell__titlebar {
        background:
          linear-gradient(
            to right,
            var(--startup-region-titlebar-rail-bg) 0,
            var(--startup-region-titlebar-rail-bg) var(--workspace-rail-width),
            var(--startup-region-titlebar-folder-bg) var(--workspace-rail-width),
            var(--startup-region-titlebar-folder-bg) calc(var(--workspace-rail-width) + var(--workspace-titlebar-folder-column-width)),
            var(--startup-region-titlebar-topic-bg) calc(var(--workspace-rail-width) + var(--workspace-titlebar-folder-column-width)),
            var(--startup-region-titlebar-topic-bg) calc(var(--workspace-rail-width) + var(--workspace-titlebar-list-current-width)),
            var(--startup-region-titlebar-document-bg) calc(var(--workspace-rail-width) + var(--workspace-titlebar-list-current-width)),
            var(--startup-region-titlebar-document-bg) calc(100% - var(--workspace-right-sidebar-current-width)),
            var(--startup-region-titlebar-sidebar-bg) calc(100% - var(--workspace-right-sidebar-current-width)),
            var(--startup-region-titlebar-sidebar-bg) 100%
          );
        min-height: var(--startup-titlebar-height);
        position: relative;
      }

      .startup-shell__body {
        display: grid;
        grid-template-columns:
          var(--workspace-rail-width)
          var(--workspace-list-folder-current-width)
          minmax(0, calc(var(--workspace-list-current-width) - var(--workspace-list-folder-current-width)))
          minmax(0, 1fr)
          var(--workspace-right-sidebar-current-width);
        min-height: 0;
        overflow: hidden;
      }

      .startup-shell__rail {
        background: var(--startup-region-main-rail-bg);
        box-sizing: border-box;
      }

      .startup-shell__folder {
        background: var(--startup-region-main-folder-bg);
        box-sizing: border-box;
      }

      .startup-shell__topic {
        background: var(--startup-region-main-topic-bg);
        box-sizing: border-box;
      }

      .startup-shell__document {
        background: var(--startup-region-main-document-bg);
        box-sizing: border-box;
      }

      .startup-shell__sidebar {
        background: var(--startup-region-main-sidebar-bg);
      }

      .startup-shell__divider {
        display: none;
      }

      @media (max-width: 1279px) {
        :root {
          --startup-right-sidebar-current-width: 0px;
          --workspace-right-sidebar-current-width: 0px;
        }

        .startup-shell__body {
          grid-template-columns:
            var(--workspace-rail-width)
            var(--workspace-list-folder-current-width)
            minmax(0, calc(var(--workspace-list-current-width) - var(--workspace-list-folder-current-width)))
            minmax(0, 1fr);
        }

        .startup-shell__sidebar {
          display: none;
        }
      }

      @media (max-width: 1079px) {
        :root {
          --startup-list-current-width: 0px;
          --workspace-list-current-width: 0px;
          --workspace-list-folder-current-width: 0px;
          --workspace-titlebar-folder-column-width: 0px;
          --workspace-titlebar-list-current-width: 0px;
        }

        .startup-shell__titlebar,
        .startup-shell__body {
          grid-template-columns: minmax(0, 1fr);
        }

        .startup-shell__rail,
        .startup-shell__folder,
        .startup-shell__topic,
        .startup-shell__sidebar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <section id="boot-skeleton" aria-hidden="true" class="startup-shell">
      <div class="startup-shell__titlebar"></div>
      <div class="startup-shell__body">
        <div class="startup-shell__rail"></div>
        <div class="startup-shell__folder"></div>
        <div class="startup-shell__topic"></div>
        <main class="startup-shell__document"></main>
        <aside class="startup-shell__sidebar"></aside>
      </div>
    </section>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
