<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foliole</title>
    <style>
      :root {
        color: #202124;
        font-family:
          -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI Variable', 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei UI', 'Microsoft YaHei', 'Noto Sans CJK SC', 'Noto Sans SC',
          sans-serif;
      }

      html, body, #root {
        height: 100%;
      }

      body {
        margin: 0;
        background: #f5f5f3;
      }

      .startup-shell {
        display: flex;
        min-height: 100%;
        flex-direction: column;
        overflow: hidden;
      }

      .startup-shell__titlebar {
        display: flex;
        align-items: center;
        min-height: 38px;
        background: #fcfcfc;
        border-bottom: 1px solid rgba(32, 33, 36, 0.18);
      }

      .startup-shell__left {
        width: 340px;
        min-width: 0;
      }

      .startup-shell__drag {
        flex: 1 1 auto;
        min-height: 38px;
      }

      .startup-shell__controls {
        width: 138px;
        min-height: 38px;
      }

      .startup-shell__body {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr);
        min-height: 0;
        flex: 1 1 auto;
        overflow: hidden;
      }

      .startup-shell__rail {
        border-right: 1px solid rgba(32, 33, 36, 0.18);
        background: #f6f6f6;
      }

      .startup-shell__content {
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      .startup-shell__grid {
        display: grid;
        grid-template-columns: minmax(0, 300px) 1px minmax(0, 1fr) 1px minmax(0, 320px);
        height: 100%;
        overflow: hidden;
      }

      .startup-shell__panel {
        min-height: 0;
        overflow: hidden;
        background: #f6f6f6;
      }

      .startup-shell__panel--main {
        background: #ffffff;
      }

      .startup-shell__divider {
        background: rgba(32, 33, 36, 0.18);
      }

      .startup-shell__main-head {
        border-bottom: 1px solid rgba(32, 33, 36, 0.18);
        padding: 16px 24px;
      }

      .startup-shell__main-copy {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        height: calc(100% - 53px);
        padding: 40px;
        overflow: hidden;
      }

      .startup-shell__loading {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .startup-shell__loading-pill {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(32, 33, 36, 0.18);
        border-top-color: rgba(32, 33, 36, 0.55);
        border-radius: 999px;
        animation: startup-spin 0.8s linear infinite;
      }

      @keyframes startup-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 1279px) {
        .startup-shell__grid {
          grid-template-columns: minmax(0, 300px) 1px minmax(0, 1fr);
        }
        .startup-shell__panel--right,
        .startup-shell__divider--right {
          display: none;
        }
      }

      @media (max-width: 1079px) {
        .startup-shell__body {
          grid-template-columns: 1fr;
        }
        .startup-shell__rail,
        .startup-shell__left {
          display: none;
        }
        .startup-shell__grid {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 34vh) minmax(0, 1fr);
        }
        .startup-shell__panel--list,
        .startup-shell__divider--list {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <section aria-busy="true" aria-label="Loading workspace" class="startup-shell">
        <div class="startup-shell__titlebar">
          <div class="startup-shell__left"></div>
          <div class="startup-shell__drag"></div>
          <div class="startup-shell__controls"></div>
        </div>
        <div class="startup-shell__body">
          <div class="startup-shell__rail"></div>
          <div class="startup-shell__content">
            <div class="startup-shell__grid">
              <aside class="startup-shell__panel startup-shell__panel--list"></aside>
              <div class="startup-shell__divider startup-shell__divider--list"></div>
              <main class="startup-shell__panel startup-shell__panel--main">
                <div class="startup-shell__main-head"></div>
                <div class="startup-shell__main-copy">
                  <div class="startup-shell__loading">
                    <div aria-label="Loading indicator" class="startup-shell__loading-pill"></div>
                  </div>
                </div>
              </main>
              <div class="startup-shell__divider startup-shell__divider--right"></div>
              <aside class="startup-shell__panel startup-shell__panel--right"></aside>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
