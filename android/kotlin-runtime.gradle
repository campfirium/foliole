// Preserve the application's existing stdlib compatibility without downgrading compiler tools.
configurations.matching { configuration ->
    configuration.name.endsWith('CompileClasspath') || configuration.name.endsWith('RuntimeClasspath')
}.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
            ['kotlin-stdlib', 'kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8'].contains(details.requested.name)) {
            details.useVersion rootProject.ext.kotlinStdlibVersion
        }
    }
}
