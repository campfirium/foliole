// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    apply from: 'buildscript-security.gradle'
    ext.kotlin_version = '2.4.21'
    project.applyBuildscriptSecurity(buildscript)

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.5.0'
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.10.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    rootProject.applyBuildscriptSecurity(buildscript)
    plugins.withId('kotlin-android') {
        kotlin {
            compilerOptions {
                languageVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0)
                apiVersion.set(org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0)
            }
        }
    }
    apply from: rootProject.file('kotlin-runtime.gradle')
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
