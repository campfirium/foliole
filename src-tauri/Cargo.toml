[package]
name = "foliole-tauri-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "foliole_tauri_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
fsrs = "5.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
