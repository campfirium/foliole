[package]
name = "foliole-tauri-core"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "foliole_tauri_core"
path = "src/lib.rs"

[features]
default = ["tauri-command"]
tauri-command = ["dep:tauri"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
directories = "5"
fontdb = "0.23"
fsrs = "5.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", optional = true , features = [] }
thiserror = "2"
