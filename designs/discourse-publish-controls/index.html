<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discourse Publish Controls</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #ffffff;
      --app-bg: #f5f5f3;
      --panel: #f8f8f7;
      --surface: #ffffff;
      --surface-2: #fbfbfa;
      --text: #202124;
      --muted: rgba(32, 33, 36, 0.62);
      --faint: rgba(32, 33, 36, 0.42);
      --border: rgba(32, 33, 36, 0.16);
      --border-strong: rgba(32, 33, 36, 0.34);
      --hover: rgba(32, 33, 36, 0.045);
      --active: rgba(32, 33, 36, 0.075);
      --shadow: 0 18px 40px rgba(15, 17, 19, 0.12);
      --green: #3f8f68;
      --blue: #3876ff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--app-bg);
      color: var(--text);
      font-size: 14px;
    }

    button, input { font: inherit; }

    .stage {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 32px;
    }

    .canvas {
      display: grid;
      width: min(1160px, 100%);
      grid-template-columns: 300px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--canvas);
      box-shadow: 0 10px 24px rgba(15, 17, 19, 0.08);
    }

    .notes {
      border-right: 1px solid var(--border);
      background: var(--panel);
      padding: 22px;
    }

    .notes h1 {
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .notes p {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.65;
    }

    .notes ul {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .notes li {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 8px;
      color: rgba(32, 33, 36, 0.78);
      line-height: 1.55;
    }

    .notes li::before {
      content: "";
      width: 6px;
      height: 6px;
      margin-top: 8px;
      border-radius: 999px;
      background: var(--green);
      opacity: 0.72;
    }

    .dialog-area {
      display: grid;
      place-items: center;
      min-height: 760px;
      padding: 34px;
      background:
        linear-gradient(90deg, rgba(32, 33, 36, 0.035) 1px, transparent 1px),
        linear-gradient(180deg, rgba(32, 33, 36, 0.035) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .dialog {
      width: min(690px, 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .dialog-header {
      padding: 22px 24px 14px;
      border-bottom: 1px solid rgba(32, 33, 36, 0.10);
    }

    .dialog-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .dialog-header p {
      margin: 7px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .form {
      display: grid;
      grid-template-columns: 128px minmax(0, 1fr);
      gap: 14px 18px;
      padding: 22px 24px 24px;
    }

    .label {
      padding-top: 9px;
      color: rgba(32, 33, 36, 0.70);
      line-height: 1.4;
    }

    .field-stack {
      display: grid;
      gap: 8px;
      min-width: 0;
      position: relative;
    }

    .trigger,
    .tag-box {
      display: flex;
      min-height: 40px;
      width: 100%;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      padding: 5px 10px 5px 12px;
      outline: none;
      transition: border-color 140ms ease, background 140ms ease, box-shadow 140ms ease;
    }

    .trigger:hover,
    .tag-box:hover {
      border-color: var(--border-strong);
      background: var(--surface);
    }

    .trigger:focus-visible,
    .tag-box:focus-within {
      border-color: var(--border-strong);
      background: var(--surface);
      box-shadow: 0 0 0 1px rgba(32, 33, 36, 0.18);
    }

    .trigger {
      justify-content: space-between;
      cursor: default;
    }

    .trigger-value {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 8px;
      font-size: 15px;
    }

    .swatch {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
      border-radius: 3px;
      background: var(--green);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    }

    .chevron {
      color: var(--muted);
      font-size: 13px;
    }

    .popover {
      position: absolute;
      z-index: 20;
      top: calc(100% + 6px);
      left: 0;
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .popover.hidden { display: none; }

    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(32, 33, 36, 0.10);
      padding: 9px 10px;
    }

    .search-row input {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      outline: none;
    }

    .search-row span { color: var(--faint); }

    .list {
      max-height: 286px;
      overflow-y: auto;
      padding: 6px;
    }

    .section-title {
      padding: 8px 8px 5px;
      color: var(--faint);
      font-size: 12px;
      font-weight: 650;
    }

    .option {
      display: grid;
      width: 100%;
      grid-template-columns: 14px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      padding: 8px;
      color: var(--text);
      text-align: left;
    }

    .option:hover { background: var(--hover); }
    .option.selected { background: var(--active); }
    .option.child { padding-left: 28px; }

    .option-main {
      display: grid;
      min-width: 0;
      gap: 2px;
    }

    .option-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 520;
    }

    .option-path {
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .check {
      color: var(--blue);
      font-size: 13px;
      visibility: hidden;
    }

    .selected .check { visibility: visible; }

    .chip {
      display: inline-flex;
      max-width: 180px;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(32, 33, 36, 0.045);
      padding: 3px 7px;
      color: rgba(32, 33, 36, 0.82);
      font-size: 13px;
      line-height: 1.25;
    }

    .chip button {
      display: grid;
      width: 16px;
      height: 16px;
      place-items: center;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      padding: 0;
    }

    .chip button:hover {
      background: rgba(32, 33, 36, 0.08);
      color: var(--text);
    }

    .tag-input {
      min-width: 90px;
      flex: 1;
      border: 0;
      background: transparent;
      outline: none;
      padding: 3px 0;
    }

    .tag-box {
      flex-wrap: wrap;
      align-items: center;
    }

    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .quick-tag {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      padding: 4px 9px;
      font-size: 13px;
    }

    .quick-tag:hover,
    .quick-tag.active {
      border-color: var(--border-strong);
      background: var(--active);
      color: var(--text);
    }

    .more {
      color: var(--text);
      min-width: 34px;
    }

    .tag-panel {
      display: grid;
      gap: 6px;
      max-height: 232px;
      overflow-y: auto;
      padding: 8px;
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid rgba(32, 33, 36, 0.10);
      padding: 14px 24px 18px;
    }

    .btn {
      height: 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: rgba(32, 33, 36, 0.82);
      padding: 0 14px;
    }

    .btn:hover { background: var(--hover); }
    .btn.primary {
      border-color: var(--border-strong);
      color: var(--text);
    }

    @media (max-width: 860px) {
      .stage { padding: 16px; }
      .canvas { grid-template-columns: 1fr; }
      .notes { border-right: 0; border-bottom: 1px solid var(--border); }
      .dialog-area { padding: 20px; }
      .form { grid-template-columns: 1fr; }
      .label { padding-top: 0; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="canvas" data-screen-label="discourse-publish-controls">
      <aside class="notes">
        <h1>发布字段控件方向</h1>
        <p>目标不是做一个新页面，而是替换原生 select / datalist 带来的系统菜单感。</p>
        <ul>
          <li>分类用自绘 combobox，浮层不出现浏览器假标题。</li>
          <li>子分类用缩进和路径辅助，不重复制造噪音。</li>
          <li>标签是 chip 输入，不再弹出系统黑色 datalist。</li>
          <li>最近使用排前面；全部标签收进同一个浅色 popover。</li>
        </ul>
      </aside>

      <section class="dialog-area">
        <div class="dialog">
          <header class="dialog-header">
            <h2>发布到 Discourse</h2>
            <p>选择本次发布使用的论坛分类和标签。设置中的 API key 不进入 Topic 内容。</p>
          </header>

          <div class="form">
            <div class="label">分类</div>
            <div class="field-stack">
              <button class="trigger" id="category-trigger" type="button" aria-expanded="true">
                <span class="trigger-value"><span class="swatch"></span><span id="category-value">论坛 · 站务</span></span>
                <span class="chevron">⌄</span>
              </button>
              <div class="popover" id="category-popover">
                <div class="search-row"><span>⌕</span><input id="category-search" placeholder="搜索分类"></div>
                <div class="list" id="category-list"></div>
              </div>
            </div>

            <div class="label">标签</div>
            <div class="field-stack">
              <div class="tag-box" id="tag-box">
                <span class="chip">学习<button type="button" data-remove="学习">×</button></span>
                <span class="chip">obsidian<button type="button" data-remove="obsidian">×</button></span>
                <input class="tag-input" id="tag-input" placeholder="输入或选择标签">
              </div>
              <div class="quick-tags" id="quick-tags"></div>
              <div class="popover hidden" id="tag-popover">
                <div class="search-row"><span>⌕</span><input id="tag-search" placeholder="搜索全部标签"></div>
                <div class="tag-panel" id="tag-list"></div>
              </div>
            </div>
          </div>

          <footer class="footer">
            <button class="btn" type="button">取消</button>
            <button class="btn primary" type="button">发布</button>
          </footer>
        </div>
      </section>
    </section>
  </main>

  <script>
    const categories = [
      { name: "学习 · 折腾", path: "", color: "#6f8f56", child: false },
      { name: "作业赏", path: "学习 · 折腾", color: "#6f8f56", child: true },
      { name: "工具 · 玩具", path: "", color: "#8a7f54", child: false },
      { name: "工具秀", path: "工具 · 玩具", color: "#8a7f54", child: true },
      { name: "编程 · 捣鼓", path: "", color: "#5d7fa3", child: false },
      { name: "代码辑", path: "编程 · 捣鼓", color: "#5d7fa3", child: true },
      { name: "语言 · 语料", path: "", color: "#8d6f96", child: false },
      { name: "外语谈", path: "语言 · 语料", color: "#8d6f96", child: true },
      { name: "论坛 · 站务", path: "", color: "#3f8f68", child: false }
    ];

    const tags = ["二语习得", "学习", "记忆", "笔记", "睡眠", "健康", "ai", "字幕", "输入法", "anki", "番茄钟", "应用", "语料库", "rss", "jlpt", "llt", "deck", "code", "认知", "obsidian", "discourse"];
    let selectedCategory = "论坛 · 站务";
    let selectedTags = ["学习", "obsidian"];

    const categoryPopover = document.querySelector("#category-popover");
    const categoryTrigger = document.querySelector("#category-trigger");
    const categoryList = document.querySelector("#category-list");
    const categoryValue = document.querySelector("#category-value");
    const categorySearch = document.querySelector("#category-search");
    const tagPopover = document.querySelector("#tag-popover");
    const quickTags = document.querySelector("#quick-tags");
    const tagList = document.querySelector("#tag-list");
    const tagBox = document.querySelector("#tag-box");
    const tagInput = document.querySelector("#tag-input");
    const tagSearch = document.querySelector("#tag-search");

    function renderCategories() {
      const query = categorySearch.value.trim().toLowerCase();
      const rows = categories.filter((category) => {
        const text = `${category.path} ${category.name}`.toLowerCase();
        return !query || text.includes(query);
      });
      categoryList.innerHTML = [
        '<div class="section-title">最近使用</div>',
        ...rows.map((category) => `
          <button class="option ${category.child ? "child" : ""} ${category.name === selectedCategory ? "selected" : ""}" type="button" data-category="${category.name}" data-color="${category.color}">
            <span class="swatch" style="background:${category.color}"></span>
            <span class="option-main">
              <span class="option-name">${category.name}</span>
              ${category.path ? `<span class="option-path">${category.path}</span>` : ""}
            </span>
            <span class="check">✓</span>
          </button>
        `)
      ].join("");
    }

    function renderTags() {
      const recent = ["二语习得", "学习", "obsidian", "discourse"];
      const visible = tags.filter((tag) => !selectedTags.includes(tag)).slice(0, 10);
      quickTags.innerHTML = [
        ...recent.filter((tag) => !selectedTags.includes(tag)).map((tag) => `<button class="quick-tag active" type="button" data-tag="${tag}">${tag}</button>`),
        ...visible.map((tag) => `<button class="quick-tag" type="button" data-tag="${tag}">${tag}</button>`),
        '<button class="quick-tag more" type="button" id="more-tags">…</button>'
      ].join("");

      const query = tagSearch.value.trim().toLowerCase();
      tagList.innerHTML = tags
        .filter((tag) => !query || tag.toLowerCase().includes(query))
        .map((tag) => `<button class="quick-tag ${selectedTags.includes(tag) ? "active" : ""}" type="button" data-tag="${tag}">${tag}</button>`)
        .join("");

      const chips = selectedTags.map((tag) => `<span class="chip">${tag}<button type="button" data-remove="${tag}">×</button></span>`).join("");
      tagBox.innerHTML = `${chips}<input class="tag-input" id="tag-input" placeholder="输入或选择标签">`;
    }

    categoryTrigger.addEventListener("click", () => {
      categoryPopover.classList.toggle("hidden");
      categorySearch.focus();
    });

    categorySearch.addEventListener("input", renderCategories);
    categoryList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      selectedCategory = button.dataset.category;
      categoryValue.textContent = selectedCategory;
      categoryValue.previousElementSibling.style.background = button.dataset.color;
      categoryPopover.classList.add("hidden");
      renderCategories();
    });

    document.addEventListener("click", (event) => {
      if (!categoryPopover.contains(event.target) && !categoryTrigger.contains(event.target)) {
        categoryPopover.classList.add("hidden");
      }
      if (!tagPopover.contains(event.target) && !tagBox.contains(event.target) && !quickTags.contains(event.target)) {
        tagPopover.classList.add("hidden");
      }
    });

    document.body.addEventListener("click", (event) => {
      const tagButton = event.target.closest("[data-tag]");
      if (tagButton) {
        const tag = tagButton.dataset.tag;
        selectedTags = selectedTags.includes(tag)
          ? selectedTags.filter((entry) => entry !== tag)
          : [...selectedTags, tag];
        renderTags();
        return;
      }

      const removeButton = event.target.closest("[data-remove]");
      if (removeButton) {
        selectedTags = selectedTags.filter((entry) => entry !== removeButton.dataset.remove);
        renderTags();
        return;
      }

      if (event.target.id === "more-tags") {
        tagPopover.classList.toggle("hidden");
        tagSearch.focus();
      }
    });

    tagSearch.addEventListener("input", renderTags);
    renderCategories();
    renderTags();
  </script>
</body>
</html>
