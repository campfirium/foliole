syntax = "proto3";
package foliole.sync.v22;
option java_package = "com.foliole.sync.v22";
option java_multiple_files = true;
message RequestObjectHeader {
  bytes request_id = 1;
  string object_type = 2;
  string global_id = 3;
  bytes source_state_hash = 4;
  string current_version_id = 5;
}
message RequestObjectEnd {
  bytes request_id = 1;
  bytes stream_hash = 2;
  uint64 fact_count = 3;
  uint64 body_count = 4;
}
message RequestObjectResult {
  bytes request_id = 1;
  string object_type = 2;
  string global_id = 3;
  string error = 4;
}
message RequestBatchEnd {
  bytes request_id = 1;
  uint32 object_count = 2;
}
message RequestAttachment {
  bytes request_id = 1;
  string operation = 2;
  string storage_key = 3;
  uint64 byte_length = 4;
  uint64 offset = 5;
  bytes data = 6;
  repeated string storage_keys = 7;
  string state = 8;
  bool pending = 9;
  uint32 max_blocks = 10;
  string derive = 11;
  uint32 extractor_version = 12;
  bool parsing_pending = 13;
}
